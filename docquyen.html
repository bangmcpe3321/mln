<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<meta name="description" content="Độc quyền — Quyền lực và cái giá: game nhập vai kinh tế 12 chương về cạnh tranh, độc quyền và người tiêu dùng.">
<title>Độc quyền — Quyền lực &amp; cái giá</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🍵</text></svg>">
<style>
  :root{
    --bg:#0b1d15;
    --panel:#122c20;
    --panel-2:#183728;
    --panel-3:#1e4331;
    --line:#2c5a43;
    --line-soft:#1d3f2f;
    --ink:#f7f4ea;
    --muted:#a6bfae;
    --faint:#6e8c78;
    --gold:#f5d070;
    --jade:#5cdbb5;
    --blue:#64b5f6;
    --violet:#ba68c8;
    --danger:#ef5350;
    --gold-soft:rgba(245,208,112,.14);
    --jade-soft:rgba(92,219,181,.14);
    --blue-soft:rgba(100,181,246,.14);
    --violet-soft:rgba(186,104,200,.14);
    --danger-soft:rgba(239,83,80,.14);
    --radius:20px;
    --radius-sm:13px;
    --shadow:0 24px 70px rgba(0,0,0,.55);
    --font:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --serif:"Palatino Linotype","Book Antiqua",Palatino,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:var(--font);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:
      radial-gradient(900px 620px at 10% -10%,rgba(245,208,112,.09),transparent 62%),
      radial-gradient(800px 560px at 94% 6%,rgba(239,83,80,.07),transparent 60%),
      radial-gradient(1000px 760px at 50% 110%,rgba(46,125,50,.18),transparent 65%),
      linear-gradient(180deg,#0b1d15,#07150f 60%,#0b1d15);
    background-attachment:fixed;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.4;
    background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse at 50% 25%,black 35%,transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 25%,black 35%,transparent 80%);
  }
  h1,h2,h3,h4,p{margin:0}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

  .app{max-width:1180px;margin:0 auto;padding:20px 18px 56px}
  .screen{display:none;animation:screenIn .42s cubic-bezier(.2,.7,.2,1)}
  .screen.active{display:block}
  @keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.92);opacity:0}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
  @keyframes glowPulse{0%,100%{opacity:.5}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
  }

  .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .serif{font-family:var(--serif)}
  .muted{color:var(--muted)}
  .faint{color:var(--faint)}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:6px 2px 18px}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .brand-mark{
    width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
    background:linear-gradient(135deg,#d32027 0%,#900c10 100%);
    border:2px solid var(--gold);color:#fff;text-decoration:none;
    font-family:var(--serif);font-size:19px;font-weight:900;
    box-shadow:0 4px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .18s,border-color .18s;
  }
  .brand-mark:hover{transform:scale(1.05);border-color:#fff}
  .brand-txt{min-width:0}
  .brand-title-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .brand-badge{
    display:inline-block;font-size:12.5px;letter-spacing:.08em;font-weight:900;text-transform:uppercase;
    color:#fff;background:linear-gradient(180deg,#d32027 0%,#aa141a 100%);
    padding:2px 8px;border:1.5px solid var(--gold);border-radius:4px;
    box-shadow:0 3px 8px rgba(0,0,0,.4);line-height:1.25;
  }
  .brand-long{font-family:var(--serif);font-size:14px;color:var(--gold);font-style:italic;font-weight:600}
  .brand-txt span#topSub{display:block;font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-top:3px}
  .top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .icon-btn{
    display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;
    border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--muted);text-decoration:none;
    font-size:12.5px;font-weight:600;transition:background .18s,border-color .18s,color .18s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.05);border-color:var(--gold);color:var(--ink)}
  .icon-btn[aria-pressed="true"]{background:var(--gold-soft);border-color:rgba(231,196,137,.4);color:var(--gold)}
  .badge-count{font-variant-numeric:tabular-nums;color:var(--gold)}

  /* ---------- title screen ---------- */
  .hero{
    position:relative;border:2px solid var(--line);border-radius:26px;overflow:hidden;
    background:linear-gradient(150deg,rgba(245,208,112,.08),#112a1f 45%,rgba(46,125,50,.1));
    box-shadow:var(--shadow);padding:clamp(26px,5vw,64px);
  }
  .hero::after{
    content:"";position:absolute;width:520px;height:520px;right:-160px;top:-220px;border-radius:50%;
    background:radial-gradient(circle,rgba(245,208,112,.15),transparent 68%);pointer-events:none;
  }
  .hero-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(22px,4vw,52px);align-items:center}
  @media(max-width:820px){.hero-grid{grid-template-columns:1fr}}
  .hero h1{
    font-family:var(--serif);font-weight:600;line-height:1.04;letter-spacing:-.015em;
    font-size:clamp(38px,6.6vw,72px);margin:14px 0 0;
  }
  .hero h1 em{font-style:italic;color:var(--gold);text-shadow:0 2px 14px rgba(245,208,112,.3)}
  .hero-lede{margin-top:18px;max-width:52ch;color:var(--muted);font-size:clamp(15px,1.6vw,17px)}
  .hero-meta{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    font-size:11.5px;letter-spacing:.06em;padding:5px 10px;border-radius:999px;
    border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--muted);
  }
  .hero-panel{border:1.5px solid var(--line);border-radius:18px;background:rgba(18,44,32,.75);padding:22px;backdrop-filter:blur(8px);box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .hero-panel h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .mode-btn{
    display:flex;width:100%;text-align:left;gap:13px;align-items:flex-start;
    border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:11px;
    background:rgba(255,255,255,.02);transition:transform .18s,border-color .18s,background .18s;
    color:inherit;text-decoration:none;
  }
  .mode-btn:hover{transform:translateY(-2px);border-color:var(--gold);background:rgba(245,208,112,.08)}
  .mode-ico{width:36px;height:36px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--gold-soft);color:var(--gold);border:1px solid rgba(245,208,112,.3)}
  .mode-btn b{display:block;font-size:14.5px;color:#fff}
  .mode-btn small{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:2px}
  .continue-row{margin-top:15px;padding-top:15px;border-top:1px dashed var(--line)}
  .link-btn{font-size:12.5px;color:var(--gold);font-weight:600;letter-spacing:.02em}
  .link-btn:hover{text-decoration:underline}

  .ending-strip{margin-top:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
  .ending-strip.clickable{cursor:pointer;user-select:none;transition:opacity .15s ease, color .15s ease}
  .ending-strip.clickable:hover{color:var(--text);opacity:.95}
  .ending-strip.clickable:hover span:first-child{text-decoration:underline}
  .ending-dots{display:flex;gap:5px}
  .ending-dots i{width:8px;height:8px;border-radius:50%;background:#2a3242;display:block}
  .ending-dots i.on{background:var(--gold);box-shadow:0 0 10px rgba(231,196,137,.6)}

  /* ---------- HUD ---------- */
  .hud{
    position:sticky;top:0;z-index:40;margin:0 -18px 22px;padding:12px 18px;
    background:linear-gradient(180deg,rgba(23,56,42,.94) 0%,rgba(17,44,33,.96) 100%);backdrop-filter:blur(14px);
    border-bottom:1.5px solid var(--line);border-top:2.5px solid var(--gold);
    box-shadow:0 12px 35px rgba(0,0,0,.5);
  }
  .hud-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .hud-chapter{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:9px;min-width:0}
  .hud-chapter b{color:var(--ink);font-size:12.5px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .round-pill{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--gold-soft);color:var(--gold);border:1px solid rgba(245,208,112,.35);white-space:nowrap;font-weight:700}
  .hud-btns{display:flex;gap:6px}
  .hud-btns .icon-btn{padding:6px 10px;font-size:11.5px}
  .stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 14px;margin-top:11px}
  @media(max-width:900px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:460px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}}
  .stat{min-width:0}
  .stat-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
  .stat-name{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat-val{font-size:12px;font-variant-numeric:tabular-nums;color:var(--gold);font-weight:800}
  .bar{height:5px;border-radius:99px;background:#0d2319;margin-top:5px;overflow:hidden;position:relative}
  .bar>span{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.7,.2,1);background:var(--gold)}
  .stat[data-k="capital"] .bar>span{background:linear-gradient(90deg,#e5b842,#f5d070)}
  .stat[data-k="share"] .bar>span{background:linear-gradient(90deg,#1e88e5,#64b5f6)}
  .stat[data-k="brand"] .bar>span{background:linear-gradient(90deg,#8e24aa,#ba68c8)}
  .stat[data-k="trust"] .bar>span{background:linear-gradient(90deg,#43a047,#66bb6a)}
  .stat[data-k="gov"] .bar>span{background:linear-gradient(90deg,#fb8c00,#ffa726)}
  .stat[data-k="legal"] .bar>span{background:linear-gradient(90deg,#e53935,#ef5350)}
  .stat.delta-up .stat-val{color:var(--jade)}
  .stat.delta-down .stat-val{color:var(--danger)}
  .stat.delta-up .bar>span,.stat.delta-down .bar>span{box-shadow:0 0 12px currentColor}
  .float-delta{
    position:fixed;z-index:90;pointer-events:none;font-size:12px;font-weight:800;
    color:var(--jade);animation:floatUp 1.15s ease-out forwards;white-space:nowrap;
    text-shadow:0 2px 10px rgba(0,0,0,.7);
  }
  @keyframes floatUp{0%{opacity:0;transform:translateY(4px)}18%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}

  /* ---------- chapter card ---------- */
  .chapter-wrap{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:22px;align-items:start}
  @media(max-width:980px){.chapter-wrap{grid-template-columns:1fr}}
  .card{
    border:2px solid var(--line);border-radius:var(--radius);background:linear-gradient(170deg,#132e22,#0d2319);
    box-shadow:var(--shadow);padding:clamp(20px,3vw,34px);animation:fadeUp .4s ease-out;
  }
  .ch-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .ch-num{font-family:var(--serif);font-size:clamp(30px,4vw,44px);line-height:1;color:rgba(245,208,112,.3);font-weight:700}
  .ch-title{font-family:var(--serif);font-size:clamp(22px,3vw,32px);line-height:1.18;font-weight:600;margin-top:6px;letter-spacing:-.01em;color:#fff}
  .ch-loc{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.04em}
  .divider{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:20px 0}
  .story p{margin:0 0 13px;color:#dbe7de;font-size:15.5px;line-height:1.72}
  .story p:last-child{margin-bottom:0}
  .story .say{border-left:3px solid var(--gold);padding:4px 0 4px 14px;color:var(--gold);font-style:italic;background:rgba(245,208,112,.05);border-radius:0 8px 8px 0}
  .who{display:block;font-style:normal;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;font-weight:700}

  .choices{margin-top:24px;display:grid;gap:11px}
  .choice{
    display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;
    padding:16px 16px 15px;border-radius:14px;border:1.5px solid var(--line);
    background:linear-gradient(160deg,#143326,#0f281e);
    position:relative;overflow:hidden;
    transition:transform .16s,border-color .16s,background .16s,box-shadow .16s;
  }
  .choice::before{
    content:"";position:absolute;top:0;left:0;right:0;height:5px;
    background:#e53935;
  }
  .choice:nth-of-type(2)::before{background:#1e88e5}
  .choice:nth-of-type(3)::before{background:#43a047}
  .choice:nth-of-type(4)::before{background:#fbc02d}
  .choice:hover:not(:disabled){
    transform:translateY(-2px);border-color:var(--gold);
    background:#194030;box-shadow:0 10px 24px rgba(0,0,0,.45);
  }
  .choice:active:not(:disabled){transform:translateY(0)}
  .choice:disabled{opacity:.45;cursor:not-allowed}
  .choice-key{
    flex:0 0 auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
    background:rgba(245,208,112,.12);border:1.5px solid var(--gold);font-size:12px;font-weight:900;color:var(--gold);
    font-variant-numeric:tabular-nums;
  }
  .choice-body{min-width:0;flex:1}
  .choice-body b{display:block;font-size:14.5px;font-weight:700;letter-spacing:.005em;color:#fff}
  .choice-body small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:3px}
  .choice-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .tag{
    font-size:10px;letter-spacing:.05em;padding:2px 7px;border-radius:5px;
    background:rgba(255,255,255,.045);color:var(--muted);border:1px solid var(--line-soft);
  }
  .tag.locked{color:var(--danger);border-color:rgba(229,142,131,.3);background:var(--danger-soft)}
  .tag.special{color:var(--violet);border-color:rgba(183,167,238,.3);background:var(--violet-soft)}

  /* ---------- side ---------- */
  .side{display:grid;gap:14px;position:sticky;top:150px}
  @media(max-width:980px){.side{position:static}}
  .panel{border:1.5px solid var(--line);border-radius:var(--radius-sm);background:#122c20;padding:16px;box-shadow:0 10px 24px rgba(0,0,0,.3)}
  .panel h3{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:10px}
  .log{display:grid;gap:9px;max-height:250px;overflow:auto;padding-right:4px}
  .log-item{font-size:12.2px;color:var(--muted);line-height:1.45;padding-left:12px;position:relative}
  .log-item::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.6}
  .log-item b{color:var(--ink);font-weight:600}
  .log-empty{font-size:12px;color:var(--faint);font-style:italic}
  .roster{display:grid;gap:8px}
  .roster-row{display:flex;align-items:center;gap:9px;font-size:12.5px}
  .avatar{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:10.5px;font-weight:800;background:var(--panel-3);color:var(--gold);border:1px solid var(--line);flex:0 0 auto}
  .roster-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .roster-row .sh{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px}
  .roster-row.me .nm{color:var(--gold)}

  /* ---------- modal / notebook / results ---------- */
  .overlay{
    position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;
    background:rgba(4,6,9,.78);backdrop-filter:blur(6px);animation:fadeUp .22s ease-out;
  }
  .overlay[hidden]{display:none}
  .modal{
    width:min(680px,100%);max-height:min(86vh,860px);overflow:auto;
    border:2px solid var(--line);border-radius:22px;background:linear-gradient(165deg,#153326,#0c2118);
    box-shadow:var(--shadow);padding:clamp(20px,3vw,32px);animation:pop .3s cubic-bezier(.2,.8,.2,1);
  }
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
  .modal-head h2{font-family:var(--serif);font-size:clamp(21px,3vw,27px);font-weight:600;line-height:1.2;color:#fff}
  .close-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);flex:0 0 auto}
  .close-btn:hover{background:rgba(255,255,255,.05);border-color:var(--gold);color:var(--ink)}
  .notebook{display:grid;gap:10px}
  .note{border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;background:rgba(255,255,255,.025)}
  .note .nt-t{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:5px}
  .note p{font-size:13.5px;color:#dbe7de;line-height:1.6}
  .note.locked p{color:var(--faint);font-style:italic}
  .note-detail{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.6;border-top:1px dashed var(--line);padding-top:8px}

  .result-banner{
    display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;margin-bottom:18px;
    border:1.5px solid rgba(245,208,112,.35);background:var(--gold-soft);
  }
  .result-banner .big{font-size:25px;line-height:1}
  .result-banner b{display:block;font-size:14px;color:#fff}
  .result-banner small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .deltas{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .delta-chip{font-size:11.5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-variant-numeric:tabular-nums}
  .delta-chip.up{color:var(--jade);border-color:rgba(92,219,181,.35);background:var(--jade-soft)}
  .delta-chip.down{color:var(--danger);border-color:rgba(239,83,80,.35);background:var(--danger-soft)}
  .consequence{font-size:14px;color:#dbe7de;line-height:1.7;margin-top:2px}
  .consequence p{margin:0 0 10px}
  .unlock{margin-top:14px;padding:12px 14px;border-radius:12px;border:1.5px dashed rgba(186,104,200,.4);background:var(--violet-soft);font-size:12.5px;color:#e1bee7}
  .unlock b{color:var(--violet)}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;
    font-weight:700;font-size:13.5px;letter-spacing:.01em;transition:transform .16s,box-shadow .16s,background .16s,border-color .16s;
    border:1.5px solid transparent;
  }
  .btn-primary{
    background:linear-gradient(135deg,#d32027 0%,#aa141a 100%);color:#fff;
    border-color:var(--gold);box-shadow:0 8px 24px rgba(211,32,39,.38);
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(211,32,39,.55);border-color:#fff}

  input[type=text],input:not([type]),textarea{
    width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);

    transition:border-color .16s,background .16s,box-shadow .16s;

  .mp-row{display:grid;grid-template-columns:34px 1fr 1.2fr;gap:8px;align-items:center}

  .mp-row .avatar{width:30px;height:30px}
  .check{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);margin:6px 0 18px;cursor:pointer}
  .check input{width:17px;height:17px;accent-color:#e7c489}
  .hint-box{font-size:12.5px;line-height:1.6;color:var(--faint);border:1px dashed var(--line);border-radius:11px;padding:11px 13px;margin-top:4px}
  .err{margin-top:12px;padding:10px 13px;border-radius:10px;background:var(--danger-soft);border:1px solid rgba(229,142,131,.32);color:var(--danger);font-size:12.5px;line-height:1.5}

  .handoff{text-align:center;padding:clamp(30px,6vw,56px) clamp(20px,4vw,40px)}
  .handoff h2{font-size:clamp(23px,3.4vw,32px);font-weight:600;margin:10px 0 12px}
  .handoff .muted{max-width:46ch;margin:0 auto}
  .avatar.big{width:74px;height:74px;border-radius:20px;font-size:28px;margin:24px auto 6px;border-width:1.5px}
  .center-card{text-align:center;padding:clamp(34px,6vw,60px)}
  .wait-dots{display:flex;gap:7px;justify-content:center;margin-top:22px}
  .wait-dots i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:glowPulse 1.2s ease-in-out infinite}
  .wait-dots i:nth-child(2){animation-delay:.18s}
  .wait-dots i:nth-child(3){animation-delay:.36s}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:26px;z-index:200;transform:translate(-50%,20px);
    width:min(440px,calc(100vw - 32px));padding:14px 16px;border-radius:14px;
    border:1px solid rgba(183,167,238,.4);background:linear-gradient(160deg,#1a1930,#121322);
    box-shadow:0 20px 55px rgba(0,0,0,.5);opacity:0;transition:opacity .3s,transform .3s;

  .toast-k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--violet);font-weight:800;margin-bottom:4px}

  .toast p{font-size:12.5px;color:var(--muted);line-height:1.5}

  /* ---------- reveal rows ---------- */
  .pick-list{display:grid;gap:10px}
  .pick-row{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.022);border:1px solid var(--line-soft)}

  .pick-body>b{display:block;font-size:13px}
  .pick-body>small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
  .pick-body .deltas{margin-top:6px}

  /* ---------- ending ---------- */
  .ending{max-width:1020px;margin:0 auto;animation:fadeUp .45s ease-out}
  .end-hero{text-align:center;padding:clamp(30px,6vw,64px) 20px clamp(26px,5vw,48px);position:relative}
  .end-hero::before{
    content:"";position:absolute;inset:0;z-index:-1;border-radius:28px;

  .end-emoji{font-size:30px;line-height:1}
  .end-emoji.big{font-size:52px;margin-bottom:16px;filter:drop-shadow(0 0 24px currentColor)}
  .end-hero h1{font-size:clamp(31px,5.4vw,56px);font-weight:600;line-height:1.08;margin:10px 0 0;letter-spacing:-.015em}
  .end-quote{max-width:56ch;margin:18px auto 0;font-family:var(--serif);font-style:italic;font-size:clamp(14px,1.7vw,17px);color:var(--muted);line-height:1.65}

  .end-h{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:12px}
  .end-p{font-size:14.5px;line-height:1.78;color:#cfd7e2;margin:0 0 12px}
  .end-p:last-child{margin-bottom:0}
  .journey{display:grid;gap:2px;padding-right:4px}
  .journey-step{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line-soft)}
  .journey-step span{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .journey-step b{font-size:12.8px;font-weight:600;color:#dbe2ec}
  .journey-step small{grid-column:2;font-size:11px;color:var(--faint)}
  .journey-step small.did{color:#9fb3cc;margin-top:2px}
  .end-list{display:grid;gap:9px}
  .end-card{display:flex;gap:13px;align-items:flex-start;padding:13px;border-radius:13px;background:rgba(255,255,255,.022);border:1px solid var(--line)}
  .end-info{min-width:0}
  .end-info>b{display:block;font-size:14px;margin:2px 0 1px}
  .end-info>small{display:block;font-size:11.5px;color:var(--faint);margin-bottom:7px}
  .market-card{background:linear-gradient(160deg,rgba(127,211,186,.05),rgba(18,22,30,.92))}
  .menu-list{display:grid;gap:9px}

  /* Trong ván chơi, HUD đã có nút Sổ tay và Menu: ẩn cụm nút trùng lặp ở thanh trên. */
  body.in-game .top-actions{display:none}

  @media(max-width:520px){
    .topbar{padding-bottom:14px;gap:8px}
    .brand-long{display:none}
    .brand-txt b{font-size:13px}
    .brand-txt span{display:none}
    .icon-btn{padding:7px 10px;font-size:11.5px}
    .hero{padding:24px 18px 26px;border-radius:20px}
    .app{padding:14px 14px 44px}
    .hud{margin:0 -14px 18px;padding:10px 14px}
    .card{border-radius:16px}
    .mp-row{grid-template-columns:28px 1fr;gap:7px}
    .mp-row input{grid-column:2}
    .ch-head{flex-direction:column;align-items:flex-start;gap:5px}
    .choice{padding:13px 13px;gap:11px}
  }

</style>
</head>

/* ---------------- tên thương hiệu trong truyện ----------------

/* ---------------- utilities ---------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const clamp = (n, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, Math.round(n)));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const signed = (n) => (n > 0 ? '+' : '') + n;

function loadJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* chế độ riêng tư */ }
}
function loadSet(key) {
  const v = loadJSON(key, []);
  return new Set(Array.isArray(v) ? v : []);
}
function saveSet(key, set) { saveJSON(key, Array.from(set)); }

const unlockedCards = loadSet(CARDS_KEY);
const unlockedEndings = loadSet(ENDINGS_KEY);

function unlockCard(id) {
  if (!id || !STORY.cards[id]) return false;
  const isNew = !unlockedCards.has(id);
  unlockedCards.add(id);
  saveSet(CARDS_KEY, unlockedCards);
  if (isNew) toastCard(id);
  return isNew;
}
function unlockEnding(id) {
  if (!STORY.endings[id]) return false;
  const isNew = !unlockedEndings.has(id);
  unlockedEndings.add(id);
  saveSet(ENDINGS_KEY, unlockedEndings);
  return isNew;
}
function hasSave() {
  const s = loadJSON(SAVE_KEY, null);

}

/* ---------------- state factory ---------------- */
function makePlayer(id, name, company, color, opts = {}) {
  return {
    id, name: name || 'Nhà sáng lập',
    company: company || PLAYER_DEFAULT_COMPANIES[0],
    color, regulator: !!opts.regulator,
    stats: { capital: 20, share: 8, brand: 12, gov: 35 },
    flags: {}, choiceId: null, done: false
  };
}

function baseState(mode) {
  return {
    v: 1, mode, screen: 'play', chapter: 0, phase: 'choose', turn: 0,
    players: [], regulator: null,
    market: { trust: 55, legal: 8 },
    log: [], cartelEver: false, lastReveal: null,
    ending: null, youAre: null
  };
}

function startSolo(name, company) {
  const st = baseState('solo');
  st.players = [makePlayer('p1', name, company, MP_COLORS[0])];
  st.youAre = 'p1';
  st.log = [{ chapter: 0, text: 'Năm 2019, <b>' + esc(company) + '</b> mở cửa hàng đầu tiên.' }];
  return st;
}

function startHotseat(names, companies, withRegulator) {
  const st = baseState('hotseat');
  st.players = names.map((n, i) => makePlayer('p' + (i + 1), n, companies[i], MP_COLORS[i]));
  const n = st.players.length;
  const each = Math.floor(100 / n);
  st.players.forEach((p, i) => {
    p.stats.capital = 24;
    p.stats.share = i === 0 ? 100 - each * (n - 1) : each;
    p.stats.brand = 14;
    p.stats.gov = 35;
  });
  normalizeShares(st);
  if (withRegulator) {
    st.regulator = {
      id: 'reg', name: 'Cơ quan quản lý', company: 'Cơ quan quản lý',
      color: '#c8c2e6', regulator: true, choiceId: null, done: false
    };
  }
  st.phase = 'handoff';
  st.turn = 0;
  st.log = [{ chapter: 0, text: 'Thị trường mở màn với ' + n + ' doanh nghiệp cùng cạnh tranh.' }];
  return st;
}

function cloneState(st) { return JSON.parse(JSON.stringify(st)); }

/* ---------------- requirements & effects ---------------- */
function statValue(st, p, key) {
  if (key === 'trust') return st.market.trust;
  if (key === 'legal') return st.market.legal;
  if (p && p.stats && key in p.stats) return p.stats[key];
  return 0;
}

function meetsReq(st, p, choice) {
  if (!choice || !choice.req) return true;
  const req = choice.req;
  const checks = [];
  if (req.stat) checks.push({ stat: req.stat, min: req.min || 0 });
  if (Array.isArray(req.all)) req.all.forEach((c) => checks.push(c));
  const okStats = checks.every((c) => statValue(st, p, c.stat) >= c.min);
  const okFlag = !req.flag || !!(p && p.flags && p.flags[req.flag]);
  return okStats && okFlag;
}

function mergedStats(st, p) {
  if (!p || p.regulator) return { capital: 0, share: 0, brand: 0, gov: 0, trust: st.market.trust, legal: st.market.legal };
  return { capital: p.stats.capital, share: p.stats.share, brand: p.stats.brand, gov: p.stats.gov, trust: st.market.trust, legal: st.market.legal };
}

function applyEffectsToPlayer(st, p, eff, opts = {}) {
  const deltas = {};
  if (!p || !p.stats) return deltas;
  ['capital', 'share', 'brand', 'gov'].forEach((k) => {
    if (typeof eff[k] !== 'number') return;
    const before = p.stats[k];
    p.stats[k] = clamp(before + eff[k]);
    deltas[k] = p.stats[k] - before;
  });
  ['trust', 'legal'].forEach((k) => {
    if (typeof eff[k] !== 'number') return;
    // Trong chế độ nhiều người, chỉ số chung được áp dụng một lần theo mức
    // trung bình của cả vòng (xem applyAverageMarket) để bốn quyết định
    // không cộng dồn thành bốn lần thay đổi.
    if (opts.deferMarket) { deltas[k] = eff[k]; return; }
    const before = st.market[k];
    st.market[k] = clamp(before + eff[k]);
    deltas[k] = st.market[k] - before;
  });
  return deltas;
}

function applyAverageMarket(st, deltasList) {
  if (!deltasList.length) return {};
  const out = {};
  ['trust', 'legal'].forEach((k) => {
    const sum = deltasList.reduce((a, d) => a + (d[k] || 0), 0);
    const avg = Math.round(sum / deltasList.length);
    const before = st.market[k];
    st.market[k] = clamp(before + avg);
    out[k] = st.market[k] - before;
  });
  return out;
}

function normalizeShares(st) {
  const companies = st.players.filter((p) => !p.regulator);
  if (!companies.length) return;
  const safe = companies.map((p) => Math.max(2, p.stats.share));
  const total = safe.reduce((a, b) => a + b, 0);
  companies.forEach((p, i) => { p.stats.share = clamp(safe[i] / total * 100, 2, 100); });
  const drift = 100 - companies.reduce((a, p) => a + p.stats.share, 0);
  if (drift) {
    const lead = companies.slice().sort((a, b) => b.stats.share - a.stats.share)[0];
    lead.stats.share = clamp(lead.stats.share + drift, 2, 100);
  }
}

/* ---------------- endings ---------------- */
function determineEnding(st, p) {
  const s = p.stats;
  const m = st.market;
  const f = p.flags || {};

  if (s.capital <= 8) return 'bankrupt';

  // Hiến chương chung: kết thúc bí mật chỉ mở khi cả nhóm cùng ký hiến chương
  // (hoặc người chơi đơn tự nguyện chọn mô hình mở ở chương cuối). Một mình ký
  // không đủ — đó là bài học về cạnh tranh lành mạnh.
  const allCharter = st.players.filter((x) => !x.regulator).every((x) => x.flags && x.flags.charter);
  const charterOpen = f.charter && (f.coalition || f.finalOpen || (st.mode !== 'solo' && allCharter));
  if (charterOpen && m.trust >= 55 && s.gov >= 50) return 'secret';
  if (s.capital <= 14 && s.share <= 12 && m.trust <= 45) return 'bankrupt';

  if (m.legal >= 72) return 'breakup';
  if (f.cartel && m.legal >= 58 && m.trust <= 42) return 'breakup';
  if (m.trust <= 24) return 'boycott';
  if (s.share >= 62) return 'empire';

  const scores = {
    empire: s.share * 1.35 + (100 - m.trust) * 0.4 + (100 - m.legal) * 0.2 + (f.finalEmpire ? 12 : 0),
    innovation: s.brand * 0.85 + m.trust * 0.5 + (100 - m.legal) * 0.25 + (f.finalCraft ? 10 : 0),
    boycott: (100 - m.trust) * 1.1 + (f.coverup ? 8 : 0) + m.legal * 0.15,
    breakup: m.legal * 1.25 + (s.share >= 50 ? 12 : 0)
  };
  return ['empire', 'innovation', 'boycott', 'breakup'].sort((a, b) => scores[b] - scores[a])[0];
}

function marketOutcome(st) {
  const companies = st.players.filter((p) => !p.regulator);
  const leader = companies.slice().sort((a, b) => b.stats.share - a.stats.share)[0];
  if (st.cartelEver && st.market.legal >= 65) return 'cartel-fine';
  if (companies.length > 1 && companies.every((p) => p.flags.charter)) return 'charter';
  if (leader && leader.stats.share >= 62) return 'dominant';
  if (st.market.legal <= 32 && st.market.trust >= 60) return 'healthy';
  return 'fragile';
}

/* ===== 21-flow.js ===== */
/* =====================================================================
   FLOW · một đường chạy chung cho solo / hot-seat / online
   ===================================================================== */

function chapterChoices() {
  if (!state) return [];
  return state.mode === 'solo' ? currentChapter().choices : mpChoices();
}

function chooserList() {
  if (!state) return [];
  const list = state.players.filter((p) => !p.regulator);
  if (state.regulator) list.push(state.regulator);
  return list;
}
function currentChooser() { return chooserList()[state.turn || 0] || chooserList()[0]; }
function isRegTurn() { return !!(state && state.regulator && currentChooser() === state.regulator); }

/* ---------------- HUD ---------------- */
function renderHUD() {
  const p = youPlayer();
  const st = p ? mergedStats(state, p) : { capital: 0, share: 0, brand: 0, gov: 0, trust: state.market.trust, legal: state.market.legal };
  const ch = currentChapter();
  const modeTag = state.mode === 'solo' ? 'Một người' : state.mode === 'hotseat' ? 'Cùng máy' : 'Trực tuyến';
  const stats = Object.keys(STORY.stats).map((k) => {
    const meta = STORY.stats[k];
    const v = st[k] || 0;
    return '<div class="stat" data-k="' + k + '"><div class="stat-head"><span class="stat-name" title="' + esc(meta.hint) + '">' + esc(meta.short) + '</span><span class="stat-val">' + v + '</span></div><div class="bar"><span style="width:' + v + '%"></span></div></div>';
  }).join('');

  let rosterHTML = '';
  if (state.mode !== 'solo') {
    rosterHTML = '<div class="panel"><h3>Bảng thị phần</h3><div class="roster">' + state.players.filter((x) => !x.regulator).map((x) => {
      const lead = x.stats.share >= 62;
      return '<div class="roster-row' + (p && x.id === p.id ? ' me' : '') + '"><span class="avatar" style="color:' + x.color + ';border-color:' + x.color + '66">' + esc(x.company.slice(0, 1).toUpperCase()) + '</span><span class="nm">' + esc(x.company) + (lead ? ' ♛' : '') + '</span><span class="sh">' + x.stats.share + '%</span></div>';
    }).join('') + (state.regulator ? '<div class="roster-row"><span class="avatar" style="color:' + state.regulator.color + ';border-color:' + state.regulator.color + '66">§</span><span class="nm">Cơ quan quản lý</span><span class="sh">—</span></div>' : '') + '</div>' +
      '<div class="divider" style="margin:12px 0"></div><div class="roster-row"><span class="nm faint">Niềm tin thị trường</span><span class="sh">' + state.market.trust + '</span></div><div class="roster-row"><span class="nm faint">Áp lực pháp lý</span><span class="sh">' + state.market.legal + '</span></div></div>';
  }

  const logItems = state.log.slice(-6).reverse().map((l) => '<div class="log-item">' + l.text + '</div>').join('');

  const hudTitle = state.mode === 'solo'
    ? (ch ? fillT(ch.title, (p && p.company) || '') : 'Hành trình')
    : mpEvent().title;
  return [
    '<div class="hud">',
      '<div class="hud-top">',
        '<div class="hud-chapter"><span class="round-pill">' + modeTag + '</span><b>Ch.' + (state.chapter + 1) + '/12 · ' + esc(hudTitle) + '</b></div>',
        '<div class="hud-btns"><button class="icon-btn" data-act="notebook" type="button">📓 Sổ tay <span class="badge-count">' + unlockedCards.size + '</span></button><button class="icon-btn" data-act="menu" type="button">☰</button></div>',
      '</div>',
      '<div class="stats">' + stats + '</div>',
    '</div>',
    '<div class="chapter-wrap">',
      '<div id="stage"></div>',
      '<aside class="side">' + rosterHTML +
        '<div class="panel"><h3>Nhật ký</h3><div class="log">' + (logItems || '<div class="log-empty">Chưa có quyết định nào.</div>') + '</div></div>' +
      '</aside>',
    '</div>'
  ].join('');
}

/* ---------------- chapter ---------------- */
function renderChapter() {
  const root = mainEl();
  if (!state) { renderTitle(root); return; }
  const ch = currentChapter();
  if (!ch) { finishGame(); return; }
  root.innerHTML = '<section class="screen active">' + renderHUD() + '</section>';
  const stage = $('#stage');

  if (state.phase === 'handoff') { renderHandoff(stage); return; }
  if (state.phase === 'waiting') { renderWaiting(stage); return; }
  if (state.mode !== 'solo' && isRegTurn()) { renderRegulatorTurn(stage, ch); return; }

  const solo = state.mode === 'solo';
  const turnPlayer = solo ? youPlayer() : currentChooser();
  const brand = (turnPlayer && turnPlayer.company) || (youPlayer() && youPlayer().company) || 'Trà Mộc';
  const ev = solo ? null : mpEvent();
  const storyHTML = solo
    ? ch.story.map((s) => s.t === 'say' ? '<p class="say"><span class="who">' + esc(fillT(s.who, brand)) + '</span>' + esc(fillT(s.x, brand)) + '</p>' : '<p>' + esc(fillT(s.x, brand)) + '</p>').join('')
    : '<p>' + esc(ev.text) + '</p><p class="say"><span class="who">' + esc(turnPlayer ? turnPlayer.company : '') + '</span>“Thị trường này đủ chỗ cho tất cả — nếu chúng ta không tự đóng cửa của nhau.”</p>';

  const choices = chapterChoices().map((c, i) => {
    const ok = meetsReq(state, turnPlayer || youPlayer(), c);
    const icon = c.icon ? c.icon + ' ' : '';
    return '<button class="choice" type="button" data-act="choose" data-id="' + c.id + '"' + (ok ? '' : ' disabled') + '>' +
      '<span class="choice-key">' + (i + 1) + '</span>' +
      '<span class="choice-body"><b>' + icon + esc(fillT(c.label, brand)) + '</b><small>' + esc(fillT(c.hint, brand)) + '</small>' +
      '<span class="choice-tags">' + (c.req ? '<span class="tag ' + (ok ? '' : 'locked') + '">' + esc(c.reqText || 'Cần điều kiện') + '</span>' : '') +
      (c.id === 'cartel' ? '<span class="tag special">cấu kết</span>' : '') +
      (c.flags && (c.flags.predatory || c.flags.platformAbuse) ? '<span class="tag">rủi ro pháp lý</span>' : '') +
      '</span></span></button>';
  }).join('');

  const whoLine = solo
    ? '<p class="foot-note">Chỉ số thay đổi ngay sau khi chọn. Bạn có thể mở Sổ tay bất cứ lúc nào.</p>'
    : '<p class="foot-note">Lượt của <b style="color:' + (turnPlayer ? turnPlayer.color : '#fff') + '">' + esc(turnPlayer ? turnPlayer.company : '') + '</b>. Thị phần là tổng không đổi: người này tăng thì người kia giảm. Lựa chọn được giữ kín đến khi công bố.</p>';

  stage.innerHTML = '<article class="card">' +
    '<div class="ch-head"><div><div class="ch-num">' + String(ch.id).padStart(2, '0') + '</div><div class="kicker">' + esc(solo ? fillT(ch.act, brand) : ev.act) + '</div></div><div class="ch-loc">' + esc(solo ? fillT(ch.location, brand) : 'Vòng ' + (state.chapter + 1) + ' · Thị trường chung') + '</div></div>' +
    '<h2 class="ch-title">' + esc(solo ? fillT(ch.title, brand) : ev.title) + '</h2>' +
    '<div class="divider"></div>' +
    '<div class="story">' + storyHTML + '</div>' +
    '<div class="choices">' + choices + '</div>' + whoLine +
  '</article>';
}

function renderRegulatorTurn(stage, ch) {
  const reg = state.regulator;
  const ev = mpEvent();
  const choices = REG_ACTIONS.map((a, i) =>
    '<button class="choice" type="button" data-act="reg-choose" data-id="' + a.id + '">' +
      '<span class="choice-key">' + (i + 1) + '</span>' +
      '<span class="choice-body"><b>' + a.icon + ' ' + esc(a.name) + '</b><small>' + esc(a.hint) + '</small></span></button>'
  ).join('');
  stage.innerHTML = '<article class="card">' +
    '<div class="ch-head"><div><div class="ch-num">§</div><div class="kicker">Lượt cơ quan quản lý</div></div><div class="ch-loc">Ch.' + (state.chapter + 1) + '</div></div>' +
    '<h2 class="ch-title">Bàn điều tiết</h2>' +
    '<div class="divider"></div>' +
    '<div class="story"><p>Bạn ngồi ở phía bên kia bàn. Biến cố vòng này: <b>' + esc(ev.title) + '</b>. Các doanh nghiệp vừa gửi quyết định của họ. Bạn có một hành động trước khi kết quả được công bố.</p></div>' +
    '<div class="choices">' + choices + '</div>' +
    '<p class="foot-note">Lượt của <b style="color:' + reg.color + '">Cơ quan quản lý</b>. Hành động này ảnh hưởng đến chỉ số chung của thị trường.</p>' +
  '</article>';
}

function renderHandoff(stage) {
  const next = currentChooser();
  const isReg = next === state.regulator;
  stage.innerHTML = '<article class="card handoff">' +
    '<div class="kicker">Chuyển máy</div>' +
    '<h2 class="serif">Chuyển cho ' + esc(isReg ? 'Cơ quan quản lý' : (next ? next.name : 'người chơi')) + '</h2>' +
    '<p class="muted">Đảm bảo người chơi trước đã rời màn hình. Lựa chọn của mỗi người chỉ hiện sau khi tất cả đã quyết định.</p>' +
    '<div class="avatar big" style="color:' + (next ? next.color : '#fff') + ';border-color:' + (next ? next.color : '#fff') + '66">' + (isReg ? '§' : (next ? esc(next.company.slice(0, 1).toUpperCase()) : '?')) + '</div>' +
    '<div class="btn-row" style="justify-content:center"><button class="btn btn-primary" data-act="reveal-hand" type="button">Tôi là ' + esc(isReg ? 'Cơ quan quản lý' : (next ? next.name : '')) + ' →</button></div>' +
  '</article>';
}

function renderWaiting(stage) {
  const remote = isOnline() && !isHost();
  stage.innerHTML = '<article class="card center-card"><div class="kicker">Đang chờ</div><h2 class="serif">Đã ghi nhận lựa chọn</h2>' +
    '<p class="muted">' + (remote ? 'Đang chờ chủ phòng công bố kết quả. Lựa chọn của bạn được giữ kín.' : 'Đang chờ người chơi còn lại. Màn hình này không tiết lộ lựa chọn của bạn.') + '</p>' +
    '<div class="wait-dots"><i></i><i></i><i></i></div></article>';
}

/* ---------------- choose ---------------- */
function choose(choiceId) {
  if (!state || state.phase !== 'choose') return;
  if (state.mode === 'solo') { resolveSolo(choiceId); return; }
  if (state.mode === 'hotseat') { chooseHotseat(choiceId); return; }
  chooseOnline(choiceId);
}

function chooseHotseat(choiceId) {
  const chooser = currentChooser();
  if (!chooser) return;
  if (isRegTurn()) {
    if (!REG_ACTIONS.some((r) => r.id === choiceId)) return;
    chooser.choiceId = choiceId;
    state.turn = 99;
    state.phase = 'reveal';
    resolveRound();
    return;
  }
  const c = chapterChoices().find((x) => x.id === choiceId);
  if (!c || !meetsReq(state, chooser, c)) return;
  chooser.choiceId = choiceId;
  const list = chooserList();
  if (state.turn < list.length - 1) {
    state.turn += 1;
    state.phase = 'handoff';
    render();
    return;
  }
  state.phase = 'reveal';
  resolveRound();
}

function resolveSolo(choiceId) {
  const ch = currentChapter();
  const p = youPlayer();
  const choice = ch.choices.find((c) => c.id === choiceId);
  if (!choice || !meetsReq(state, p, choice)) return;
  const before = new Set(unlockedCards);
  const deltas = applyEffectsToPlayer(state, p, choice.effects);

  // Doanh thu vận hành: thị phần hiện có nuôi lại vốn, như ở chế độ nhiều người.
  const income = Math.round(p.stats.share * 0.18);
  if (income) {
    const capBefore = p.stats.capital;
    p.stats.capital = clamp(p.stats.capital + income);
    deltas.capital = (deltas.capital || 0) + (p.stats.capital - capBefore);
  }

  Object.assign(p.flags, choice.flags || {});
  p.history = (p.history || []).concat([{ chapter: state.chapter, label: choice.label }]);
  state.lastReveal = {
    kind: 'solo', chapter: state.chapter,
    choiceLabel: choice.label, result: choice.result, deltas,
    card: choice.card || null, market: {}
  };
  if (choice.card) unlockCard(choice.card);
  contextCards(state, p);
  state.lastReveal.newCards = Array.from(unlockedCards).filter((id) => !before.has(id));
  state.log.push({ chapter: state.chapter, text: '<b>Ch.' + (state.chapter + 1) + ':</b> ' + esc(choice.label) });
  state.phase = 'result';
  saveGame();
  render();
  openResult();
}

/* Thẻ kiến thức mở theo bối cảnh — chỉ xuất hiện đúng lúc chỉ số chạm ngưỡng. */
function contextCards(st, p) {
  if (!p) return;
  if (st.market.legal >= 55) unlockCard('chia-tach');
  if (p.stats.share >= 35) unlockCard('thi-phan');
  if (p.stats.share >= 55) unlockCard('loi-nhuan-doc-quyen');
  if (st.market.trust <= 40) unlockCard('nguoi-tieu-dung');
  if (p.flags && (p.flags.cartel || p.flags.predatory)) unlockCard('thao-tung-gia');
}

function resolveRound() {
  const companies = state.players.filter((p) => !p.regulator);
  const deltasByPlayer = {};
  const picks = [];
  const choices = chapterChoices();
  const beforeCards = new Set(unlockedCards);

  companies.forEach((p) => {
    const c = choices.find((x) => x.id === p.choiceId) || choices[0];
    const d = applyEffectsToPlayer(state, p, c.effects, { deferMarket: true });
    Object.assign(p.flags, c.flags || {});
    p.history = (p.history || []).concat([{ chapter: state.chapter, label: c.label }]);
    if (c.id === 'cartel' || (c.flags && c.flags.cartel)) state.cartelEver = true;

    // Doanh thu vận hành theo thị phần: thị phần lớn nuôi được nhiều chi nhánh hơn.
    const income = Math.round(p.stats.share * 0.18);
    if (income) {
      const before = p.stats.capital;
      p.stats.capital = clamp(p.stats.capital + income);
      d.capital = (d.capital || 0) + (p.stats.capital - before);
    }

    if (state.mode !== 'solo' && c.id === 'acquire') {
      const rival = companies.filter((x) => x.id !== p.id).sort((a, b) => b.stats.share - a.stats.share)[0];
      if (rival) {
        const take = Math.max(1, Math.min(4, rival.stats.share - 2));
        rival.stats.share = clamp(rival.stats.share - take);
        p.stats.share = clamp(p.stats.share + take);
      }
    }
    if (state.mode !== 'solo' && c.id === 'open') p.flags.charter = true;
    deltasByPlayer[p.id] = d;
    picks.push({ p, c, d });
  });

  const cartelCount = picks.filter((x) => x.c.id === 'cartel' || (x.c.flags && x.c.flags.cartel)).length;
  const priceWarCount = picks.filter((x) => x.c.id === 'price' || (x.c.flags && x.c.flags.priceWar)).length;
  let extra = {};
  if (cartelCount >= 2) {
    companies.forEach((p) => { p.stats.capital = clamp(p.stats.capital + 5); });
    state.market.trust = clamp(state.market.trust - 10);
    state.market.legal = clamp(state.market.legal + 14);
    state.cartelEver = true;
    extra.cartelDetected = true;
    // thẻ kiến thức về cấu kết xuất hiện đúng lúc bị phát hiện
    unlockCard('cartel');
    unlockCard('thao-tung-gia');
  }
  if (priceWarCount >= 2) {
    companies.forEach((p) => { p.stats.capital = clamp(p.stats.capital - 4); });
    state.market.trust = clamp(state.market.trust + 3);
    extra.priceWar = true;
  }

  // Sáp nhập chỉ thành công khi hai bên cùng nhắm vào nhau trong cùng một vòng.
  // Bên lớn giữ thương hiệu mẹ; bên nhỏ thành thương hiệu con với phần thị phần
  // được giữ lại, nên không ai bị loại khỏi ván chơi.
  const mergerPicks = picks.filter((x) => x.c.id === 'merge');
  const merged = [];
  const mergedIds = new Set();
  if (mergerPicks.length >= 2) {
    // Mỗi lời đề nghị nhắm tới đối thủ lớn nhất của mình. Chỉ khi hai bên cùng
    // nhắm vào nhau thì thương vụ mới thành.
    const target = (p) => companies
      .filter((x) => x.id !== p.id)
      .sort((a, b) => b.stats.share - a.stats.share)[0];
    mergerPicks.forEach((a) => {
      if (mergedIds.has(a.p.id)) return;
      const b = mergerPicks.find((x) => !mergedIds.has(x.p.id) && x.p.id !== a.p.id && target(a.p) === x.p && target(x.p) === a.p);
      if (!b) return;
      mergedIds.add(a.p.id); mergedIds.add(b.p.id);
      const big = a.p.stats.share >= b.p.stats.share ? a.p : b.p;
      const small = big === a.p ? b.p : a.p;
      const carve = 8;
      const freed = Math.max(1, small.stats.share - carve);
      small.stats.share = clamp(carve);
      big.stats.share = clamp(big.stats.share + freed);
      big.stats.brand = clamp(big.stats.brand + 2);
      small.stats.brand = clamp(small.stats.brand + 1);
      big.flags.merged = true;
      small.flags.mergedInto = big.id;
      big.stats.capital = clamp(big.stats.capital + 2);
      small.stats.capital = clamp(small.stats.capital + 4);
      merged.push({ big: big.company, small: small.company });
      deltasByPlayer[big.id].share = (deltasByPlayer[big.id].share || 0) + freed;
      deltasByPlayer[small.id].share = -freed;
    });
    if (merged.length) { extra.merged = merged; unlockCard('thon-tinh-sap-nhap'); }
  }
  const failedMerges = mergerPicks.filter((x) => !mergedIds.has(x.p.id));
  if (failedMerges.length) {
    // Đề nghị không được đáp lại: mất thời gian, bị soi, không có thương vụ.
    failedMerges.forEach((x) => {
      x.p.stats.capital = clamp(x.p.stats.capital - 2);
      deltasByPlayer[x.p.id].capital = (deltasByPlayer[x.p.id].capital || 0) - 2;
    });
    state.market.legal = clamp(state.market.legal + 2);
    extra.mergeFailed = failedMerges.length;
  }

  let regAction = null;
  if (state.regulator && state.regulator.choiceId) {
    regAction = REG_ACTIONS.find((r) => r.id === state.regulator.choiceId) || null;
    applyRegulator(regAction, companies, extra);
  }

  const avg = applyAverageMarket(state, companies.map((p) => deltasByPlayer[p.id]));
  normalizeShares(state);

  picks.forEach((x) => {
    const note = (x.c.id === 'cartel' || (x.c.flags && x.c.flags.cartel)) ? ' <span class="tag special">cấu kết</span>' : '';
    state.log.push({ chapter: state.chapter, text: '<b>' + esc(x.p.company) + ':</b> ' + esc(x.c.label) + note });
  });

  const you = youPlayer();
  picks.forEach((x) => {
    if (state.mode === 'hotseat') { if (x.c.card) unlockCard(x.c.card); contextCards(state, x.p); }
    else if (you && x.p.id === you.id) { if (x.c.card) unlockCard(x.c.card); contextCards(state, x.p); }
  });
  const newCards = Array.from(unlockedCards).filter((id) => !beforeCards.has(id));

  state.lastReveal = {
    kind: 'multi', chapter: state.chapter,
    picks: picks.map((x) => ({ id: x.p.id, company: x.p.company, color: x.p.color, label: x.c.label, deltas: deltasByPlayer[x.p.id], card: x.c.card || null })),
    market: avg, extra, regAction: regAction ? regAction.name : null, newCards
  };
  if (regAction) state.log.push({ chapter: state.chapter, text: '<b>Cơ quan quản lý:</b> ' + esc(regAction.name) });
  companies.forEach((p) => { p.done = false; p.choiceId = null; p.targetId = null; });
  if (state.regulator) { state.regulator.done = false; state.regulator.choiceId = null; }

  state.phase = 'reveal';
  if (isOnline() && isHost()) broadcastState();
  render();
  openReveal();
}

function applyRegulator(action, companies, extra) {
  if (!action) return;
  if (action.id === 'investigate') {
    state.market.legal = clamp(state.market.legal + 8);
    if (extra) extra.investigated = true;
  } else if (action.id === 'protect') {
    state.market.trust = clamp(state.market.trust + 7);
    state.market.legal = clamp(state.market.legal - 3);
  } else if (action.id === 'support') {
    const sorted = companies.slice().sort((a, b) => b.stats.share - a.stats.share);
    sorted.forEach((p, i) => { p.stats.share = clamp(p.stats.share + (i === 0 ? -3 : 3)); });
    state.market.trust = clamp(state.market.trust + 3);
    if (extra) extra.supported = true;
  } else if (action.id === 'wait') {
    const lead = companies.slice().sort((a, b) => b.stats.share - a.stats.share)[0];
    if (lead) lead.stats.share = clamp(lead.stats.share + 2);
  }
}

function continueGame() {
  closeOverlay();
  if (isOnline() && !isHost()) {
    // Khách không tự sang chương: chủ phòng quyết định nhịp và sẽ gửi trạng thái mới.
    state.phase = 'waiting';
    render();
    return;
  }
  if (state.chapter >= STORY.chapters.length - 1) { finishGame(); return; }
  state.chapter += 1;
  state.phase = state.mode === 'hotseat' ? 'handoff' : 'choose';
  state.turn = 0;
  state.players.forEach((p) => { p.done = false; p.choiceId = null; });
  if (state.regulator) { state.regulator.done = false; state.regulator.choiceId = null; }
  if (isOnline() && isHost()) broadcastState();
  saveGame();
  render();
}

function finishGame() {
  const companies = state.players.filter((p) => !p.regulator);
  const results = companies.map((p) => {
    const id = determineEnding(state, p);
    unlockEnding(id);
    return { p, ending: STORY.endings[id], id };
  });
  const you = youPlayer();
  const yourResult = results.find((r) => you && r.p.id === you.id) || results[0];
  if (state.mode === 'solo') unlockEnding(yourResult.id);
  state.ending = { id: yourResult.id, results, market: marketOutcome(state) };
  state.screen = 'ending';
  saveJSON(SAVE_KEY, null);
  if (isOnline() && isHost()) broadcastState();
  render();
}

    (state.mode !== 'solo'
      ? '<div class="card market-card" style="margin-top:18px">' +
          '<div class="kicker">Kết cục thị trường</div><h3 class="end-h" style="font-size:20px;margin-top:4px">' + esc(market.title) + '</h3><p class="end-p">' + esc(market.text) + '</p>' +
        '</div>'
      : '') +
    '<div class="ending-strip clickable" data-act="endings" role="button" tabindex="0" style="justify-content:center;margin:18px auto 0" title="Xem danh sách kết thúc đã mở"><span>Kết thúc đã mở</span><span class="ending-dots">' + endingDots + '</span><span>' + unlockedEndings.size + '/6 (nhấn xem)</span></div>' +
    '<div class="btn-row" style="justify-content:center;margin-top:16px">' +
      '<button class="btn btn-primary" data-act="restart" type="button">Chơi lại</button>' +
      '<button class="btn btn-ghost" data-act="notebook" type="button">Sổ tay (' + unlockedCards.size + '/' + Object.keys(STORY.cards).length + ')</button>' +
      '<button class="btn btn-ghost" data-act="endings" type="button">Bộ sưu tập (6)</button>' +
      '<a class="btn btn-ghost" href="index.html">Trang chủ</a>' +
    '</div>' +
    '<p class="foot-note" style="text-align:center">Mỗi con đường đều để lại một bài học khác nhau.</p>' +
  '</div></section>';
}


/* ===== 30-boot.js ===== */
/* =====================================================================
   ONLINE · WebRTC data channel + trao đổi mã thủ công
   ===================================================================== */
const RTC_CFG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function encodeSDP(desc) {
  return btoa(unescape(encodeURIComponent(JSON.stringify({ t: desc.type, s: desc.sdp }))));
}
function decodeSDP(text) {
  const raw = atob(String(text).trim().replace(/\s+/g, ''));
  const obj = JSON.parse(decodeURIComponent(escape(raw)));
  return { type: obj.t, sdp: obj.s };
}
function waitIce(pc) {
  return new Promise((resolve) => {
    if (pc.iceGatheringState === 'complete') { resolve(); return; }
    const check = () => { if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', check); resolve(); } };
    pc.addEventListener('icegatheringstatechange', check);
    setTimeout(resolve, 4000);
  });
}

function bindChannel(dc, hostSide) {
  NET.dc = dc;
  dc.onopen = () => {
    NET.connected = true;
    if (hostSide) {
      const s = $('#netStatus'); if (s) s.textContent = 'Đã kết nối. Đang chờ người chơi thứ hai…';
    } else {
      dc.send(JSON.stringify({ type: 'hello', name: pending ? pending.name : 'Người chơi 2', company: pending ? pending.company : 'Trà Vương' }));
      const s = $('#netStatus'); if (s) s.textContent = 'Đã kết nối. Đang chờ chủ phòng bắt đầu…';
    }
  };
  dc.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    handleNetMessage(msg, hostSide);
  };
  dc.onclose = () => { NET.connected = false; };
}

function handleNetMessage(msg, hostSide) {
  if (hostSide) {
    if (msg.type === 'hello') {
      NET.guestName = String(msg.name || 'Người chơi 2').slice(0, 24);
      NET.guestCompany = String(msg.company || 'Trà Vương').slice(0, 28);
      state = startHotseat(
        [pending.name || 'Bạn', NET.guestName],
        [pending.company || 'Trà Mộc', NET.guestCompany],
        false
      );
      state.mode = 'online';
      state.youAre = 'p1';
      state.phase = 'choose';
      closeOverlay();
      pending = null;
      broadcastState();
      render();
    } else if (msg.type === 'pick') {
      remotePick = msg.id;
      if (state && state._hostPick) resolveOnlineRound(state._hostPick, remotePick);
    } else if (msg.type === 'restart') {
      renderTitle(mainEl());
    }
    return;
  }
  if (!state) return;
  if (msg.type === 'state' && msg.state) {
    state = msg.state;
    state.mode = 'online';
    state.youAre = 'p2';
    closeOverlay();
    render();
    if (state.phase === 'reveal' && state.lastReveal) openReveal();
    if (state.screen === 'ending') renderEnding(mainEl());
  }
}

function broadcastState() {
  if (!NET.connected || !NET.dc || NET.dc.readyState !== 'open' || !state) return;
  const copy = cloneState(state);
  copy.net = null;
  // Không gửi lựa chọn chưa công bố của chủ phòng sang máy khách.
  delete copy._hostPick;
  try { NET.dc.send(JSON.stringify({ type: 'state', state: copy })); } catch (e) { /* bỏ qua */ }
}

async function hostCreateOffer() {
  try {
    const pc = new RTCPeerConnection(RTC_CFG);
    NET.pc = pc; NET.role = 'host'; NET.connected = false;
    if (NET.dc) { try { NET.dc.close(); } catch (e) {} NET.dc = null; }
    const dc = pc.createDataChannel('game', { ordered: true });
    bindChannel(dc, true);
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitIce(pc);
    NET.offer = encodeSDP(pc.localDescription);
    pending.onlineStage = 'host-offer';
    pending.error = '';
  } catch (e) {
    pending.error = 'Không tạo được mã mời: ' + e.message;
  }
  render();
}

async function hostAcceptAnswer() {
  const ta = $('#answerIn');
  if (!ta || !ta.value.trim()) { pending.error = 'Hãy dán mã trả lời của người chơi thứ hai.'; render(); return; }
  try {
    const desc = decodeSDP(ta.value);
    await NET.pc.setRemoteDescription(desc);
    pending.error = '';
    const s = $('#netStatus'); if (s) s.textContent = 'Đang kết nối…';
    render();
  } catch (e) {
    pending.error = 'Mã trả lời không hợp lệ: ' + e.message;
    render();
  }
}

async function guestJoinOffer() {
  const ta = $('#offerIn');
  if (!ta || !ta.value.trim()) { pending.error = 'Hãy dán mã mời từ chủ phòng.'; render(); return; }
  try {
    const desc = decodeSDP(ta.value);
    const pc = new RTCPeerConnection(RTC_CFG);
    NET.pc = pc; NET.role = 'guest';
    pc.ondatachannel = (ev) => bindChannel(ev.channel, false);
    await pc.setRemoteDescription(desc);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await waitIce(pc);
    NET.answer = encodeSDP(pc.localDescription);
    pending.onlineStage = 'guest-answer';
    pending.error = '';
  } catch (e) {
    pending.error = 'Không thể đọc mã mời: ' + e.message;
  }
  render();
}

function chooseOnline(choiceId) {
  const c = chapterChoices().find((x) => x.id === choiceId);
  if (!c || !meetsReq(state, youPlayer(), c)) return;
  if (isHost()) {
    state._hostPick = choiceId;
    if (remotePick) { resolveOnlineRound(choiceId, remotePick); return; }
    state.phase = 'waiting';
    render();
  } else {
    if (!NET.dc || NET.dc.readyState !== 'open') {
      toastNetError('Mất kết nối với chủ phòng. Hãy tải lại trang và kết nối lại.');
      return;
    }
    NET.dc.send(JSON.stringify({ type: 'pick', id: choiceId }));
    state.phase = 'waiting';
    render();
  }
}

function toastNetError(message) {
  const el = document.createElement('div');
  el.className = 'toast show';
  el.innerHTML = '<div class="toast-k">Kết nối</div><b>Không gửi được lựa chọn</b><p>' + esc(message) + '</p>';
  document.body.appendChild(el);
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 5200);
}

function resolveOnlineRound(hostPickId, guestPickId) {
  const hostP = state.players.find((p) => p.id === 'p1');
  const guestP = state.players.find((p) => p.id === 'p2');
  if (hostP) hostP.choiceId = hostPickId;
  if (guestP) guestP.choiceId = guestPickId;
  state._hostPick = null;
  remotePick = null;
  state.phase = 'choose';
  resolveRound();
}

function copyField(sel, btn) {
  const el = $(sel);
  if (!el) return;
  const text = el.value || el.textContent || '';
  const done = () => {
    if (!btn) return;
    const old = btn.textContent;
    btn.textContent = 'Đã sao chép ✓';
    setTimeout(() => { btn.textContent = old; }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => { el.select(); document.execCommand('copy'); done(); });
  } else {
    el.select();
    try { document.execCommand('copy'); } catch (e) { /* bỏ qua */ }
    done();
  }
}

/* =====================================================================
   Render dispatcher
   ===================================================================== */
function render() {
  document.body.classList.toggle('in-game', !!(state && state.screen === 'play'));
  const nc = $('#noteCount');
  if (nc) nc.textContent = unlockedCards.size;
  if (!state) { renderTitle(mainEl()); return; }
  if (state.screen === 'setup') { renderSetup(mainEl()); return; }
  if (state.screen === 'ending') { renderEnding(mainEl()); return; }
  if (state.chapter >= STORY.chapters.length) { finishGame(); return; }
  renderChapter();
}

function goHome() {
  closeOverlay();
  if (state && state.screen === 'play') saveGame();
  if (NET.dc) { try { NET.dc.close(); } catch (e) {} NET.dc = null; }
  NET.connected = false;
  state = null;
  pending = null;
  renderTitle(mainEl());
}

function restartGame() {
  closeOverlay();
  const mode = state ? state.mode : 'solo';
  if (mode === 'online') {
    if (state && isOnline() && !isHost()) {
      if (NET.dc && NET.dc.readyState === 'open') NET.dc.send(JSON.stringify({ type: 'restart' }));
      goHome();
      return;
    }
    if (state && isOnline() && isHost() && NET.connected) {
      if (NET.dc && NET.dc.readyState === 'open') NET.dc.send(JSON.stringify({ type: 'restart' }));
    }
    openSetup('online');
    return;
  }
  openSetup(mode);
}

function startFromSetup() {
  if (!pending) return;
  pending.error = '';
  if (pending.mode === 'online') {
    if (!pending.name.trim()) pending.name = 'Bạn';
    if (!pending.company.trim()) pending.company = 'Trà Mộc';
    if (pending.role === 'host') { hostCreateOffer(); return; }
    pending.onlineStage = 'guest-input';
    render();
    return;
  }
  if (pending.mode === 'solo') {
    const name = (pending.name || 'Bạn').trim().slice(0, 24) || 'Bạn';
    const company = (pending.company || 'Trà Mộc').trim().slice(0, 28) || 'Trà Mộc';
    state = startSolo(name, company);
    saveGame();
    closeOverlay();
    render();
    return;
  }
  const n = pending.count;
  const names = [];
  const comps = [];
  for (let i = 0; i < n; i++) {
    names.push((pending.names[i] || 'Người chơi ' + (i + 1)).trim().slice(0, 18) || 'Người chơi ' + (i + 1));
    comps.push((pending.companies[i] || PLAYER_DEFAULT_COMPANIES[i]).trim().slice(0, 22) || PLAYER_DEFAULT_COMPANIES[i]);
  }
  state = startHotseat(names, comps, pending.withRegulator);
  saveGame();
  closeOverlay();
  render();
}

/* ---------------- delegated events ---------------- */
document.addEventListener('click', (ev) => {
  const btn = ev.target.closest('[data-act]');
  if (!btn) {
    if (ev.target.classList && ev.target.classList.contains('overlay')) closeOverlay();
    return;
  }
  const act = btn.dataset.act;
  if (act === 'mode') { openSetup(btn.dataset.mode); return; }
  if (act === 'home') { goHome(); return; }
  if (act === 'continue') { continueGame(); return; }
  if (act === 'continue-save') { loadSaved(); return; }
  if (act === 'choose') { choose(btn.dataset.id); return; }
  if (act === 'reg-choose') {
    if (!state || !state.regulator) return;
    state.regulator.choiceId = btn.dataset.id;
    state.phase = 'reveal';
    resolveRound();
    return;
  }
  if (act === 'reveal-hand') { state.phase = 'choose'; saveGame(); render(); return; }
  if (act === 'notebook') { openNotebook(); return; }
  if (act === 'endings') { openEndings(); return; }
  if (act === 'menu') { openMenu(); return; }
  if (act === 'close') { closeOverlay(); return; }
  if (act === 'restart') { restartGame(); return; }
  if (act === 'reset-progress') { resetProgress(); return; }
  if (act === 'start') { startFromSetup(); return; }
  if (act === 'mp-count') {
    pending.count = Number(btn.dataset.n);
    if (pending.count >= 4) pending.withRegulator = false;
    render();
    return;
  }
  if (act === 'online-role') { pending.role = btn.dataset.role; pending.error = ''; render(); return; }
  if (act === 'copy-offer') { copyField('#offerOut', btn); return; }
  if (act === 'copy-answer') { copyField('#answerOut', btn); return; }
  if (act === 'host-accept') { hostAcceptAnswer(); return; }
  if (act === 'guest-join') { guestJoinOffer(); return; }
});

document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (!pending) return;
  if (el.type === 'checkbox' && el.dataset.field === 'regulator') { pending.withRegulator = el.checked; return; }
  if (!el.dataset.field) return;
  const f = el.dataset.field;
  if (f !== 'name' && f !== 'company') return;
  if (el.dataset.i !== undefined) {
    const i = Number(el.dataset.i);
    if (f === 'name') pending.names[i] = el.value; else pending.companies[i] = el.value;
  } else {
    pending[f] = el.value;
  }
});

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') { closeOverlay(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target && ev.target.dataset && ev.target.dataset.act === 'endings') {
    ev.preventDefault();
    openEndings();
    return;
  }
  if (!state || state.screen !== 'play') return;
  if (ev.target && /input|textarea|select/i.test(ev.target.tagName)) return;
  if (ev.key >= '1' && ev.key <= '4') {
    const idx = Number(ev.key) - 1;
    if (state.mode !== 'solo' && isRegTurn()) {
      const a = REG_ACTIONS[idx];
      if (!a) return;
      state.regulator.choiceId = a.id;
      state.phase = 'reveal';
      resolveRound();
      return;
    }
    const list = chapterChoices();
    if (!list[idx]) return;
    if (state.mode === 'solo' || state.phase === 'choose') choose(list[idx].id);
  }
});

/* ---------------- boot ---------------- */
(function boot() {
  const params = new URLSearchParams(location.search);
  if (params.get('fresh') === '1') saveJSON(SAVE_KEY, null);
  if (params.get('reset') === '1' || params.get('clear') === '1') {
    try {
      localStorage.removeItem(SAVE_KEY);
      localStorage.removeItem(CARDS_KEY);
      localStorage.removeItem(ENDINGS_KEY);
    } catch (e) {}
    unlockedCards.clear();
    unlockedEndings.clear();
  }
  renderTitle(mainEl());
  if (params.get('resume') === '1') loadSaved();
  const nc = $('#noteCount'); if (nc) nc.textContent = unlockedCards.size;
})();
</script>
