<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101310">
<meta name="description" content="Bài giảng Nhóm 1 về vật chất theo triết học Mác - Lênin: quan điểm lịch sử, định nghĩa của Lênin, vận động, đứng im, không gian, thời gian và tính thống nhất vật chất của thế giới.">
<title>Vật Chất &amp; Vận Động — Triết Học Mác - Lênin (Nhóm 1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --amber:#F5B731;
  --white:#ffffff;
  --muted:rgba(255,255,255,0.72);
  --ease:cubic-bezier(0.65,0,0.35,1);
  --card-width:170px;
  --card-height:265px;
  --card-gap:22px;
  --card-slot:192px;
  --body-font:"Roboto",Arial,sans-serif;
  --display-font:"Oswald","Bebas Neue",Impact,sans-serif;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  color:var(--white);
  background:#101310;
  font-family:var(--body-font);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,a{color:inherit;font:inherit;-webkit-tap-highlight-color:transparent}
button{border:0;background:transparent;cursor:pointer}
a{text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:4px}

.experience{
  position:relative;
  isolation:isolate;
  width:100vw;
  height:100vh;
  height:100dvh;
  min-height:520px;
  overflow:hidden;
  background:#111;
}

/* Background photo and dark gradient */
.backdrop,.backdrop-shade{position:absolute;inset:0}
.backdrop{z-index:-2;overflow:hidden;background:#181c19;pointer-events:none}
.backdrop img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 50%;
  transform:scale(1.015);
  transition:opacity .35s ease,transform 7s ease;
}
.backdrop img.is-switching{opacity:.12;transform:scale(1.055)}
.backdrop-shade{
  z-index:-1;
  pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,0.78) 0%,rgba(0,0,0,0.64) 34%,rgba(0,0,0,0.35) 60%,rgba(0,0,0,0.15) 100%),
             linear-gradient(0deg,rgba(0,0,0,0.65) 0%,transparent 45%);
}

/* Top progress bar */
.top-progress{
  position:absolute;
  z-index:50;
  inset:0 0 auto;
  height:3px;
  background:rgba(255,255,255,0.13);
  pointer-events:none;
}
.top-progress span,.line-progress{
  display:block;
  width:100%;
  height:100%;
  background:var(--amber);
  transform:scaleX(0);
  transform-origin:left center;
  will-change:transform;
}

/* Site header / Navigation */
.site-header{
  position:absolute;
  z-index:15;
  top:0;
  left:0;
  display:flex;
  width:100%;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  padding:32px 6.2vw 20px;
}
.brand{
  display:inline-flex;
  flex:0 0 auto;
  align-items:center;
  gap:12px;
  min-width:max-content;
  font-size:12px;
  font-weight:600;
  letter-spacing:.25em;
  line-height:1;
  text-transform:uppercase;
}
.brand-mark{width:24px;height:24px;color:var(--amber);flex:0 0 auto}
.brand-text{display:flex;flex-direction:column;gap:3px}
.brand-title{color:#fff;letter-spacing:.28em}
.brand-sub{color:var(--amber);font-size:9px;letter-spacing:.15em;font-weight:400}

.nav-links{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:clamp(14px,2vw,30px);
  margin-left:auto;
}
.nav-link{
  position:relative;
  padding:8px 0;
  color:rgba(255,255,255,0.78);
  font-size:11px;
  font-weight:500;
  letter-spacing:.1em;
  line-height:1;
  text-transform:uppercase;
  white-space:nowrap;
  transition:color .2s ease;
}
.nav-link::after{
  position:absolute;
  right:0;
  bottom:0;
  left:0;
  height:2px;
  background:var(--amber);
  content:"";
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .22s ease;
}
.nav-link:hover,.nav-link.is-active{color:#fff}
.nav-link.is-active::after{transform:scaleX(1)}

.nav-tools{display:flex;align-items:center;gap:14px}
.icon-button,.menu-toggle{
  display:grid;
  width:32px;
  height:32px;
  padding:0;
  place-items:center;
  border-radius:50%;
  color:#fff;
  transition:color .2s ease,background-color .2s ease,transform .2s ease;
}
.icon-button:hover{color:var(--amber);background:rgba(255,255,255,0.08);transform:translateY(-1px)}
.icon-button:disabled{cursor:default;opacity:.6}
.icon-button svg{width:18px;height:18px}
.menu-toggle{display:none;width:34px}
.menu-toggle span{display:block;width:21px;height:1.5px;background:#fff;transition:transform .2s ease}
.menu-toggle span+span{margin-top:-7px}
.menu-open .menu-toggle span:first-child{transform:translateY(3px) rotate(45deg)}
.menu-open .menu-toggle span:last-child{transform:translateY(-4px) rotate(-45deg)}

/* Left content block */
.hero-copy{
  position:absolute;
  z-index:3;
  bottom:8.5vh;
  left:8vw;
  width:min(520px,40vw);
}
.hero-copy.is-outgoing,.hero-copy.is-entering{pointer-events:none}
.copy-part{
  --stagger:0ms;
  opacity:1;
  transform:translateY(0);
  transition:opacity .34s ease var(--stagger),transform .34s ease var(--stagger);
}
.hero-copy.is-outgoing .copy-part,
.hero-copy.is-entering:not(.is-visible) .copy-part{
  opacity:0;
  transform:translateY(20px);
}
.hero-copy.is-outgoing .copy-part{transition-duration:.18s;transition-delay:0s}
[data-copy=region]{--stagger:0ms}
[data-copy=title]{--stagger:100ms}
[data-copy=description]{--stagger:200ms}
[data-copy=actions]{--stagger:300ms}

.region-line{
  display:flex;
  align-items:center;
  gap:13px;
  margin:0 0 26px;
  color:rgba(255,255,255,0.85);
  font-size:16px;
  font-weight:400;
  letter-spacing:.04em;
  line-height:1.2;
}
.region-dash{width:20px;height:2px;flex:0 0 auto;background:var(--amber)}

.hero-title{
  margin:0;
  color:#fff;
  font-family:var(--display-font);
  font-size:clamp(56px,7.5vw,100px);
  font-weight:700;
  letter-spacing:.015em;
  line-height:.95;
  text-transform:uppercase;
}
.hero-title span{display:block;white-space:nowrap}

.hero-description{
  max-width:420px;
  margin:18px 0 24px;
  color:var(--muted);
  font-size:13.5px;
  font-weight:300;
  line-height:1.65;
}

.hero-actions{display:flex;align-items:center;gap:14px}
.bookmark{
  display:grid;
  width:42px;
  height:42px;
  flex:0 0 auto;
  place-items:center;
  border:1px solid var(--amber);
  border-radius:50%;
  color:#15130e;
  background:var(--amber);
  transition:transform .2s ease,background-color .2s ease,color .2s ease;
}
.bookmark:hover{transform:scale(1.06)}
.bookmark svg{width:16px;height:18px}
.bookmark[aria-pressed="true"] svg path{fill:currentColor}

.discover{
  display:inline-flex;
  min-height:42px;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:0 22px;
  border:1px solid rgba(255,255,255,0.82);
  border-radius:999px;
  color:#fff;
  font-size:11px;
  font-weight:600;
  letter-spacing:.09em;
  line-height:1;
  text-transform:uppercase;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease;
}
.discover:hover{
  border-color:var(--amber);
  color:#19150c;
  background:var(--amber);
}
.discover svg{width:12px;height:12px;transition:transform .2s ease}
.discover:hover svg{transform:translateX(3px)}

/* Right card rail */
.destinations{position:absolute;z-index:5;inset:0;pointer-events:none}
.cards-shell{
  position:absolute;
  top:43.5%;
  left:44vw;
  width:calc(100vw - 44vw + 80px);
  overflow:visible;
  pointer-events:auto;
}
.cards-track{
  display:flex;
  width:max-content;
  gap:var(--card-gap);
  transform:translateX(0);
  will-change:transform;
}
.cards-track.is-shifting{
  transform:translateX(calc(-1 * var(--card-slot)));
}
.cards-track.is-shifting,.cards-track.is-restoring{
  transition:transform .8s var(--ease);
}

.card-item{flex:0 0 var(--card-width)}
.destination-card{
  position:relative;
  display:flex;
  width:var(--card-width);
  height:var(--card-height);
  flex:0 0 var(--card-width);
  flex-direction:column;
  justify-content:flex-end;
  padding:0;
  text-align:left;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.15);
  border-radius:14px;
  background:#262a27;
  box-shadow:0 14px 36px rgba(0,0,0,0.28);
  isolation:isolate;
  cursor:pointer;
  transition:border-color .2s ease;
}
.destination-card:hover{border-color:rgba(245,183,49,0.5)}
.card-photo{
  position:absolute;
  z-index:-2;
  inset:0;
  background-position:center;
  background-size:cover;
  transition:transform .55s ease;
}
.destination-card::after{
  position:absolute;
  z-index:-1;
  inset:0;
  background:linear-gradient(180deg,transparent 25%,rgba(0,0,0,0.2) 45%,rgba(0,0,0,0.88) 100%);
  content:"";
}
.destination-card:hover .card-photo{transform:scale(1.06)}

.card-caption{padding:0 15px 17px}
.card-dash{display:block;width:16px;height:2px;margin-bottom:9px;background:var(--amber)}
.card-region{
  display:block;
  margin-bottom:7px;
  color:rgba(255,255,255,0.85);
  font-size:11px;
  font-weight:500;
  letter-spacing:.08em;
  line-height:1.3;
  text-transform:uppercase;
}
.card-title{
  display:block;
  color:#fff;
  font-family:var(--display-font);
  font-size:21px;
  font-weight:600;
  letter-spacing:.02em;
  line-height:.98;
  text-transform:uppercase;
}
.card-title span{display:block}

/* Below the cards: controls & counter */
.rail-controls{
  position:absolute;
  z-index:7;
  right:5vw;
  bottom:7.6vh;
  left:44vw;
  display:flex;
  align-items:center;
  gap:27px;
  pointer-events:auto;
}
.arrow-group{display:flex;flex:0 0 auto;gap:12px}
.arrow-button{
  display:grid;
  width:58px;
  height:58px;
  flex:0 0 auto;
  place-items:center;
  border:1px solid rgba(255,255,255,0.68);
  border-radius:50%;
  color:#fff;
  background:transparent;
  transition:border-color .2s ease,color .2s ease,transform .2s ease;
}
.arrow-button:hover{
  border-color:var(--amber);
  color:var(--amber);
  transform:scale(1.05);
}
.arrow-button:disabled{cursor:wait;opacity:.6}
.arrow-button svg{width:18px;height:18px}

.line-progress-track{
  height:1px;
  flex:1 1 auto;
  overflow:hidden;
  background:rgba(255,255,255,0.35);
}
.slide-counter{
  display:flex;
  min-width:64px;
  align-items:baseline;
  justify-content:flex-end;
  gap:5px;
  overflow:hidden;
  white-space:nowrap;
}
.counter-window{display:block;height:48px;overflow:hidden}
.counter-number{
  display:block;
  color:#fff;
  font-family:var(--display-font);
  font-size:48px;
  font-weight:700;
  line-height:1;
  transition:opacity .18s ease,transform .18s ease;
}
.counter-number.is-out{opacity:0;transform:translateY(-100%)}
.counter-number.is-in{opacity:0;transform:translateY(100%)}
.counter-total{color:rgba(255,255,255,0.65);font-size:11px;letter-spacing:.09em;font-weight:500}

/* Photo expansion animation */
.photo-expansion{
  position:absolute;
  z-index:1;
  top:var(--start-top);
  left:var(--start-left);
  width:var(--start-width);
  height:var(--start-height);
  overflow:hidden;
  border-radius:14px;
  background-color:#181c19;
  background-position:center;
  background-size:cover;
  transform:translateZ(0);
  transition:top .8s var(--ease),left .8s var(--ease),width .8s var(--ease),height .8s var(--ease),border-radius .8s var(--ease);
  pointer-events:none;
}
.photo-expansion::after{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,0.78) 0%,rgba(0,0,0,0.64) 34%,rgba(0,0,0,0.35) 60%,rgba(0,0,0,0.15) 100%),
             linear-gradient(0deg,rgba(0,0,0,0.65) 0%,transparent 45%);
  content:"";
}
.photo-expansion.is-expanded{
  top:0;
  left:0;
  width:100%;
  height:100%;
  border-radius:0;
}

/* Glassmorphic Slide Detail Modal */
.content-modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(8,10,9,0.78);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  opacity:0;
  pointer-events:none;
  transition:opacity .3s ease;
}
.content-modal.is-open{opacity:1;pointer-events:auto}
.modal-box{
  position:relative;
  width:min(660px,94vw);
  max-height:86vh;
  overflow-y:auto;
  padding:36px 36px 32px;
  background:rgba(22,26,23,0.95);
  border:1px solid rgba(255,255,255,0.16);
  border-radius:20px;
  box-shadow:0 24px 64px rgba(0,0,0,0.55);
  transform:scale(0.96) translateY(18px);
  transition:transform .3s cubic-bezier(0.16,1,0.3,1);
}
.content-modal.is-open .modal-box{transform:scale(1) translateY(0)}
.modal-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  margin-bottom:20px;
}
.modal-badge{
  display:inline-block;
  padding:4px 12px;
  border:1px solid var(--amber);
  border-radius:999px;
  color:var(--amber);
  font-size:10px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:12px;
}
.modal-title{
  margin:0;
  color:#fff;
  font-family:var(--display-font);
  font-size:28px;
  font-weight:700;
  line-height:1.2;
  text-transform:uppercase;
}
.modal-close{
  display:grid;
  width:36px;
  height:36px;
  flex:0 0 auto;
  place-items:center;
  border-radius:50%;
  color:rgba(255,255,255,0.7);
  background:rgba(255,255,255,0.08);
  transition:color .2s ease,background-color .2s ease;
}
.modal-close:hover{color:#fff;background:rgba(255,255,255,0.18)}
.modal-body{
  color:rgba(255,255,255,0.85);
  font-size:14px;
  font-weight:300;
  line-height:1.75;
}
.modal-body h3{margin:20px 0 10px;color:var(--amber);font-size:15px;font-weight:500}
.modal-table-wrap{overflow-x:auto;margin:0 0 18px}
.modal-table-wrap table{width:100%;min-width:480px;border-collapse:collapse;font-size:12px;line-height:1.6}
.modal-table-wrap th,.modal-table-wrap td{padding:10px 12px;border:1px solid rgba(255,255,255,.15);text-align:left;vertical-align:top}
.modal-table-wrap th{color:var(--amber);background:rgba(245,183,49,.08);font-weight:500}
.lesson-figure{margin:20px 0;padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(10,15,21,.6)}
.lesson-figure>svg{display:block;width:100%;height:auto}
.lesson-figure figcaption{margin-top:10px;color:var(--muted);font-size:11px;line-height:1.6}
.motion-examples{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;padding:12px 0}
.motion-examples>div{flex:1 1 82px;text-align:center;color:var(--amber)}
.motion-examples svg{display:block;width:48px;height:48px;margin:0 auto 10px}
.motion-examples strong{font-size:12px;font-weight:500;color:var(--white)}
.modal-body p{margin:0 0 14px}
.modal-body ul{margin:0 0 16px;padding-left:20px}
.modal-body li{margin-bottom:8px}
.modal-body blockquote{
  margin:18px 0;
  padding:14px 18px;
  border-left:3px solid var(--amber);
  background:rgba(245,183,49,0.08);
  border-radius:0 8px 8px 0;
  font-style:italic;
  color:#fff;
}
.modal-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-top:24px;
  padding-top:18px;
  border-top:1px solid rgba(255,255,255,0.1);
}
.modal-nav-button{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 16px;
  border:1px solid rgba(255,255,255,0.25);
  border-radius:999px;
  font-size:11px;
  font-weight:500;
  letter-spacing:.08em;
  text-transform:uppercase;
  transition:border-color .2s ease,color .2s ease;
}
.modal-nav-button:hover{border-color:var(--amber);color:var(--amber)}

/* Search overlay palette */
.search-modal{
  position:fixed;
  inset:0;
  z-index:110;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:12vh 20px 20px;
  background:rgba(8,10,9,0.78);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
}
.search-modal.is-open{opacity:1;pointer-events:auto}
.search-box{
  width:min(560px,94vw);
  background:rgba(22,26,23,0.96);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:18px;
  box-shadow:0 24px 60px rgba(0,0,0,0.6);
  overflow:hidden;
}
.search-input-wrap{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px 20px;
  border-bottom:1px solid rgba(255,255,255,0.1);
}
.search-input-wrap svg{width:18px;height:18px;color:var(--amber);flex:0 0 auto}
.search-input{
  width:100%;
  border:0;
  background:transparent;
  color:#fff;
  font-size:14px;
  outline:none;
}
.search-results{
  max-height:380px;
  overflow-y:auto;
  padding:10px 12px;
}
.search-item{
  display:flex;
  width:100%;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:12px 14px;
  border-radius:10px;
  text-align:left;
  transition:background-color .2s ease;
}
.search-item:hover{background:rgba(255,255,255,0.08)}
.search-item-info{display:flex;flex-direction:column;gap:3px}
.search-item-region{color:var(--amber);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.search-item-title{color:#fff;font-weight:500;font-size:13px}
.search-item-counter{color:rgba(255,255,255,0.5);font-size:11px;font-family:var(--display-font)}

/* Responsive adjustments */
@media(max-width:1120px) and (min-width:768px){
  .site-header{padding-inline:4vw;gap:20px}
  .brand-text{display:none}
  .nav-links{gap:14px}
  .nav-link{font-size:10px}
  .hero-copy{left:6vw;width:38vw}
  .hero-title{font-size:clamp(52px,7.5vw,80px)}
  .cards-shell,.rail-controls{left:46vw}
  .rail-controls{right:4vw;gap:18px}
  .arrow-button{width:52px;height:52px}
  .arrow-group{gap:9px}
}

@media(max-width:767px){
  :root{
    --card-width:122px;
    --card-height:clamp(150px,22vh,190px);
    --card-gap:14px;
    --card-slot:136px;
  }
  .backdrop img{object-position:56% center}
  .site-header{padding:22px 6vw 14px;gap:12px}
  .brand-text{display:none}
  .nav-links{
    position:absolute;
    top:66px;
    right:6vw;
    display:none;
    width:min(320px,88vw);
    align-items:stretch;
    justify-content:flex-start;
    gap:0;
    margin:0;
    padding:8px 16px;
    border:1px solid rgba(255,255,255,0.18);
    border-radius:12px;
    background:rgba(12,15,13,0.96);
    box-shadow:0 16px 40px rgba(0,0,0,0.4);
    backdrop-filter:blur(16px);
  }
  .menu-open .nav-links{display:flex;flex-direction:column}
  .nav-link{padding:12px 0;font-size:11px;text-align:left}
  .nav-link::after{right:auto;width:28px}
  .menu-toggle{display:grid;gap:5px;margin-left:2px}
  .menu-toggle span+span{margin-top:0}

    "modalContent": "<h3>Bối cảnh<\/h3>\n<ul><li>Khoảng thế kỷ VIII–III trước Công nguyên.<\/li><li>Triết học hình thành ở Hy Lạp, Ấn Độ và Trung Hoa.<\/li><li>Con người dần chuyển từ việc giải thích thế giới bằng thần thoại sang giải thích bằng tự nhiên và lý trí.<\/li><\/ul>\n<div class=\"modal-table-wrap\"><table><thead><tr><th scope=\"col\">Khu vực / triết gia<\/th><th scope=\"col\">Quan điểm về vật chất<\/th><\/tr><\/thead><tbody><tr><td>Thales (Hy Lạp)<\/td><td>Nước là bản nguyên của vạn vật.<\/td><\/tr><tr><td>Heraclitus (Hy Lạp)<\/td><td>Lửa là bản nguyên; mọi sự vật luôn vận động và biến đổi.<\/td><\/tr><tr><td>Democritus (Hy Lạp)<\/td><td>Thế giới cấu tạo từ nguyên tử và khoảng không.<\/td><\/tr><tr><td>Trâu Diễn (Trung Hoa cổ đại)<\/td><td>Thuyết Ngũ hành: Kim, Mộc, Thủy, Hỏa, Thổ là các yếu tố tạo thành và chi phối vạn vật.<\/td><\/tr><tr><td>Kanada / Charvaka (Ấn Độ cổ đại)<\/td><td>Một số trường phái nêu quan niệm về hạt vật chất cực nhỏ, thường được gọi là nguyên tử.<\/td><\/tr><\/tbody><\/table><\/div>",

  const bars = [document.getElementById("top-progress-bar"), document.getElementById("line-progress")];
  const nextButton = document.getElementById("next-slide");
  const previousButton = document.getElementById("previous-slide");
  const menuToggle = document.querySelector(".menu-toggle");
  const navLinks = Array.from(document.querySelectorAll(".nav-link"));

  // Modal elements
  const contentModal = document.getElementById("content-modal");
  const modalClose = document.getElementById("modal-close");
  const modalBadge = document.getElementById("modal-badge");
  const modalTitle = document.getElementById("modal-title");
  const modalBody = document.getElementById("modal-body");
  const modalPrev = document.getElementById("modal-prev");
  const modalNext = document.getElementById("modal-next");

  // Search palette elements
  const searchTrigger = document.getElementById("search-trigger");
  const bookmarksTrigger = document.getElementById("bookmarks-trigger");
  const searchModal = document.getElementById("search-modal");
  const searchInput = document.getElementById("search-input");
  const searchResults = document.getElementById("search-results");

  const bookmarkStorageKey = "matter-group1-bookmarks";
  const saved = new Set();
  try {
    const stored = JSON.parse(localStorage.getItem(bookmarkStorageKey) || "[]");
    if (Array.isArray(stored)) {
      stored.forEach((index) => {
        if (Number.isInteger(index) && index >= 0 && index < slides.length) saved.add(index);
      });
    }
  } catch {
    // Storage may be unavailable or contain invalid data; start with an empty set.
  }
  const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");
  const autoplayToggle = document.getElementById("autoplay-toggle");
  const pauseIcon = document.getElementById("autoplay-pause-icon");
  const playIcon = document.getElementById("autoplay-play-icon");
  const transitionControls = [
    nextButton, previousButton, bookmark, discover, modalPrev, modalNext,
    searchTrigger, bookmarksTrigger, ...navLinks
  ];
  let activeIndex = 0;
  let transitioning = false;
  let userPaused = false;
  let hoverPaused = experience.matches(":hover");
  let focusPaused = experience.contains(document.activeElement);
  let timer = null;
  let timerStarted = 0;
  let timeLeft = duration;
  let contentReturnFocus = null;
  let searchReturnFocus = null;

  counterTotal.textContent = "/ " + String(slides.length).padStart(2, "0");

  function setTransitioning(busy) {
    transitioning = busy;
    experience.setAttribute("aria-busy", String(busy));
    transitionControls.forEach((control) => { control.disabled = busy; });
    track.querySelectorAll("button").forEach((card) => { card.disabled = busy; });
  }

  function makeCard(slide, index) {
    const item = document.createElement("article");
    item.className = "card-item";
    item.setAttribute("role", "listitem");
    item.dataset.slideIndex = String(index);

    const card = document.createElement("button");
    card.type = "button";
    card.className = "destination-card";
    card.disabled = transitioning;
    card.setAttribute("aria-label", slide.region + ": " + slide.title.join(" "));

    const photo = document.createElement("div");
    photo.className = "card-photo";
    photo.setAttribute("aria-hidden", "true");
    photo.style.backgroundImage = 'url("' + slide.image + '")';

    const caption = document.createElement("div");
    caption.className = "card-caption";
    const dash = document.createElement("span");
    dash.className = "card-dash";
    dash.setAttribute("aria-hidden", "true");

    const label = document.createElement("span");
    label.className = "card-region";
    label.textContent = slide.region;

    const title = document.createElement("strong");
    title.className = "card-title";
    slide.title.forEach((line) => {
      const span = document.createElement("span");
      span.textContent = line;
      title.appendChild(span);
    });

    caption.append(dash, label, title);
    card.append(photo, caption);
    item.appendChild(card);
    card.addEventListener("click", () => { void navigateToSlide(index, item); });
    return item;
  }

  function renderCards() {
    const cards = document.createDocumentFragment();
    for (let step = 1; step <= 5; step++) {
      const index = (activeIndex + step) % slides.length;
      cards.appendChild(makeCard(slides[index], index));
    }
    track.replaceChildren(cards);
  }

  function renderContentModal(index) {
    const slide = slides[index];
    modalBadge.textContent = slide.badge;
    modalTitle.textContent = slide.modalHeading;
    modalBody.innerHTML = slide.modalContent;
    contentModal.querySelector(".modal-box").scrollTop = 0;
  }

  function renderSlide(index) {
    const slide = slides[index];
    region.textContent = slide.region;
    line1.textContent = slide.title[0];
    line2.textContent = slide.title[1];
    description.textContent = slide.description;
    bookmark.setAttribute("aria-pressed", String(saved.has(index)));
    bookmark.setAttribute("aria-label", (saved.has(index) ? "Bỏ lưu slide " : "Lưu slide ") + slide.title.join(" "));

    navLinks.forEach((link, idx) => {
      const isActive = idx === slide.navCategory;
      link.classList.toggle("is-active", isActive);
      if (isActive) link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
    });
    if (contentModal.classList.contains("is-open")) renderContentModal(index);
  }

  function paintProgress(ratio) {
    const value = Math.max(0, Math.min(1, ratio));
    bars.forEach((bar) => {
      bar.style.transition = "none";
      bar.style.transform = "scaleX(" + value + ")";
    });
  }

  function stopAutoplay() {
    if (timer === null) return;
    clearTimeout(timer);
    timer = null;
    timeLeft = Math.max(0, timeLeft - (performance.now() - timerStarted));
    paintProgress(1 - timeLeft / duration);
  }

  function syncAutoplay() {
    const reduced = motionPreference.matches;
    const explicitlyPaused = userPaused || reduced;
    autoplayToggle.disabled = reduced;
    autoplayToggle.setAttribute("aria-pressed", String(explicitlyPaused));
    autoplayToggle.setAttribute("aria-label", reduced
      ? "Tự động chuyển slide đã tắt theo tùy chọn giảm chuyển động"
      : userPaused ? "Tiếp tục tự động chuyển slide" : "Tạm dừng tự động chuyển slide");
    pauseIcon.style.display = explicitlyPaused ? "none" : "";
    playIcon.style.display = explicitlyPaused ? "" : "none";

    const blocked = explicitlyPaused || hoverPaused || focusPaused || document.hidden ||
      transitioning || header.classList.contains("menu-open") ||
      contentModal.classList.contains("is-open") || searchModal.classList.contains("is-open");
    if (blocked) {
      stopAutoplay();
      return;
    }
    if (timer !== null) return;

    paintProgress(1 - timeLeft / duration);
    timerStarted = performance.now();
    bars.forEach((bar) => {
      void bar.offsetWidth;
      bar.style.transition = "transform " + timeLeft + "ms linear";
      bar.style.transform = "scaleX(1)";
    });
    timer = setTimeout(() => {
      timer = null;
      timeLeft = duration;
      changeSlide(1);
    }, timeLeft);
  }

  function waitForMotion(element, property) {
    const animations = element.getAnimations({ subtree: true })
      .filter((animation) => !property || animation.transitionProperty === property);
    return Promise.all(animations.map((animation) => animation.finished.catch(() => {})));
  }

  async function updateCounter(index) {
    counter.classList.add("is-out");
    await waitForMotion(counter);
    counter.textContent = String(index + 1).padStart(2, "0");
    counter.classList.remove("is-out");
    counter.classList.add("is-in");
    void counter.offsetWidth;
    counter.classList.remove("is-in");
    await waitForMotion(counter);
  }

  async function animateCopy(index) {
    copy.classList.add("is-outgoing");
    await waitForMotion(copy);
    renderSlide(index);
    copy.classList.remove("is-outgoing");
    copy.classList.add("is-entering");
    void copy.offsetWidth;
    copy.classList.add("is-visible");
    await waitForMotion(copy);
    copy.classList.remove("is-entering", "is-visible");
  }

  function prepareExpansion(card, reverse = false) {
    const rect = card.getBoundingClientRect();
    const bounds = experience.getBoundingClientRect();
    const expansion = document.createElement("div");
    expansion.className = "photo-expansion";
    expansion.setAttribute("aria-hidden", "true");
    expansion.style.backgroundImage = card.querySelector(".card-photo").style.backgroundImage;
    expansion.style.setProperty("--start-top", (rect.top - bounds.top) + "px");
    expansion.style.setProperty("--start-left", (rect.left - bounds.left) + "px");
    expansion.style.setProperty("--start-width", rect.width + "px");
    expansion.style.setProperty("--start-height", rect.height + "px");
    if (reverse) expansion.classList.add("is-expanded");
    experience.appendChild(expansion);
    card.style.visibility = "hidden";
    void expansion.offsetWidth;
    expansion.classList.toggle("is-expanded", !reverse);
    return expansion;
  }

  async function animateBackground(index, promoted, previousIndex) {
    if (promoted) {
      const forward = promoted === track.firstElementChild;
      const expansion = prepareExpansion(promoted);
      try {
        if (forward) {
          const incomingIndex = (index + 5) % slides.length;
          track.appendChild(makeCard(slides[incomingIndex], incomingIndex));
          void track.offsetWidth;
          track.classList.add("is-shifting");
        }
        await Promise.all([waitForMotion(expansion), waitForMotion(track)]);
        activePhoto.src = slides[index].image;
      } finally {
        expansion.remove();
      }
    } else if (index === (previousIndex - 1 + slides.length) % slides.length) {
      // Reverse the forward transition: return the current background to the rail.
      const returning = makeCard(slides[previousIndex], previousIndex);
      track.prepend(returning);
      const expansion = prepareExpansion(returning, true);
      try {
        activePhoto.src = slides[index].image;
        // Keep the existing cards in place before animating them one slot right.
        track.style.transform = "translateX(calc(-1 * var(--card-slot)))";
        void track.offsetWidth;
        track.classList.add("is-restoring");
        track.style.removeProperty("transform");
        await Promise.all([waitForMotion(expansion), waitForMotion(track)]);
      } finally {
        expansion.remove();
      }
    } else {
      activePhoto.classList.add("is-switching");
      await waitForMotion(activePhoto, "opacity");
      activePhoto.src = slides[index].image;
      activePhoto.classList.remove("is-switching");
      await waitForMotion(activePhoto, "opacity");
    }
  }

  async function navigateToSlide(index, promoted = null) {
    if (transitioning || index === activeIndex || !Number.isInteger(index) ||
        index < 0 || index >= slides.length) return;

    const previousIndex = activeIndex;
    const focusedCard = track.contains(document.activeElement);
    setTransitioning(true);
    stopAutoplay();
    timeLeft = duration;
    paintProgress(0);
    try {
      if (motionPreference.matches) {
        activeIndex = index;
        renderSlide(index);
        counter.textContent = String(index + 1).padStart(2, "0");
        activePhoto.src = slides[index].image;
      } else {
        const image = new Image();
        image.src = slides[index].image;
        await image.decode().catch(() => {});
        activeIndex = index;
        await Promise.all([
          animateCopy(index), updateCounter(index), animateBackground(index, promoted, previousIndex)
        ]);
      }
    } finally {
      track.classList.remove("is-shifting", "is-restoring");
      track.style.removeProperty("transform");
      renderCards();
      setTransitioning(false);
      if (focusedCard) nextButton.focus({ preventScroll: true });
      syncAutoplay();
    }
  }

  function changeSlide(direction) {
    const index = (activeIndex + direction + slides.length) % slides.length;
    return navigateToSlide(index, direction > 0 ? track.firstElementChild : null);
  }

  function jumpToSlide(index) {
    return navigateToSlide(index);
  }

  // Dialog state is also an independent reason to pause autoplay.
  function openContentModal(index) {
    if (transitioning) return;
    contentReturnFocus = document.activeElement;
    renderContentModal(index);
    contentModal.inert = false;
    contentModal.setAttribute("aria-hidden", "false");
    contentModal.classList.add("is-open");
    syncAutoplay();
    modalClose.focus();
  }

  function closeContentModal() {
    contentModal.classList.remove("is-open");
    contentModal.inert = true;
    contentModal.setAttribute("aria-hidden", "true");
    contentReturnFocus?.focus({ preventScroll: true });
    syncAutoplay();
  }

  function openSearchModal() {
    if (transitioning) return;
    searchReturnFocus = document.activeElement;
    searchModal.inert = false;
    searchModal.setAttribute("aria-hidden", "false");
    searchModal.classList.add("is-open");
    syncAutoplay();
    searchInput.value = "";
    renderSearchResults("");
    searchInput.focus();
  }

  function closeSearchModal() {
    searchModal.classList.remove("is-open");
    searchModal.inert = true;
    searchModal.setAttribute("aria-hidden", "true");
    searchReturnFocus?.focus({ preventScroll: true });
    syncAutoplay();
  }

  function normalizeSearch(text) {
    return text.toLowerCase().normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/đ/g, "d")
      .replace(/\s+/g, " ")
      .trim();
  }

  function renderSearchResults(query) {
    const q = normalizeSearch(query);
    searchResults.innerHTML = "";
    const filtered = slides.filter((slide) => {
      if (!q) return true;
      return [slide.title.join(" "), slide.region, slide.description, slide.modalContent]
        .some((text) => normalizeSearch(text).includes(q));
    });

    if (filtered.length === 0) {
      searchResults.innerHTML = '<div style="padding:20px;text-align:center;color:rgba(255,255,255,0.6);font-size:13px;">Không tìm thấy slide phù hợp với từ khóa.</div>';
      return;
    }

    filtered.forEach((slide) => {
      const idx = slides.indexOf(slide);
      const item = document.createElement("button");
      item.type = "button";
      item.className = "search-item";
      item.innerHTML = `
        <div class="search-item-info">
          <span class="search-item-region">${slide.region}</span>
          <span class="search-item-title">${slide.title.join(" ")}</span>
        </div>
        <span class="search-item-counter">${String(idx + 1).padStart(2, "0")} / ${slides.length}</span>
      `;
      item.addEventListener("click", () => {
        closeSearchModal();
        jumpToSlide(idx);
      });
      searchResults.appendChild(item);
    });
  }

  // Event Listeners
  nextButton.addEventListener("click", () => changeSlide(1));
  previousButton.addEventListener("click", () => changeSlide(-1));

  bookmark.addEventListener("click", () => {
    if (saved.has(activeIndex)) saved.delete(activeIndex);
    else saved.add(activeIndex);
    try {
      localStorage.setItem(bookmarkStorageKey, JSON.stringify(Array.from(saved)));
    } catch {
      // Keep bookmarks available for this visit when browser storage is blocked.
    }
    bookmark.setAttribute("aria-pressed", String(saved.has(activeIndex)));
    bookmark.setAttribute("aria-label", (saved.has(activeIndex) ? "Bỏ lưu slide " : "Lưu slide ") + slides[activeIndex].title.join(" "));
  });

  discover.addEventListener("click", () => openContentModal(activeIndex));
  modalClose.addEventListener("click", closeContentModal);
  contentModal.addEventListener("click", (e) => {
    if (e.target === contentModal) closeContentModal();
  });

  modalPrev.addEventListener("click", () => {
    const prev = (activeIndex - 1 + slides.length) % slides.length;
    jumpToSlide(prev);
  });

  modalNext.addEventListener("click", () => {
    const next = (activeIndex + 1) % slides.length;
    jumpToSlide(next);
  });

  searchTrigger.addEventListener("click", openSearchModal);
  bookmarksTrigger.addEventListener("click", () => {
    openSearchModal();
    if (saved.size === 0) {
      searchResults.innerHTML = '<div style="padding:20px;text-align:center;color:rgba(255,255,255,0.6);font-size:13px;">Bạn chưa đánh dấu slide nào. Hãy nhấn nút bookmark tròn màu hổ phách để lưu slide yêu thích!</div>';
    } else {
      searchResults.innerHTML = "";
      saved.forEach((idx) => {
        const slide = slides[idx];
        const item = document.createElement("button");
        item.type = "button";
        item.className = "search-item";
        item.innerHTML = `
          <div class="search-item-info">
            <span class="search-item-region">${slide.region}</span>
            <span class="search-item-title">${slide.title.join(" ")}</span>
          </div>
          <span class="search-item-counter">${String(idx + 1).padStart(2, "0")} / ${slides.length}</span>
        `;
        item.addEventListener("click", () => {
          closeSearchModal();
          jumpToSlide(idx);
        });
        searchResults.appendChild(item);
      });
    }
  });

  searchInput.addEventListener("input", () => renderSearchResults(searchInput.value));
  searchModal.addEventListener("click", (e) => {
    if (e.target === searchModal) closeSearchModal();
  });

  menuToggle.addEventListener("click", () => {
    const open = menuToggle.getAttribute("aria-expanded") !== "true";
    menuToggle.setAttribute("aria-expanded", String(open));
    menuToggle.setAttribute("aria-label", open ? "Đóng điều hướng" : "Mở điều hướng");
    header.classList.toggle("menu-open", open);
    syncAutoplay();
  });

  navLinks.forEach((link) => {
    link.addEventListener("click", () => {
      const jumpIndex = parseInt(link.dataset.jump, 10);
      jumpToSlide(jumpIndex);
      header.classList.remove("menu-open");
      menuToggle.setAttribute("aria-expanded", "false");
      syncAutoplay();
    });
  });

  autoplayToggle.addEventListener("click", () => {
    userPaused = !userPaused;
    syncAutoplay();
  });
  experience.addEventListener("pointerenter", () => {
    hoverPaused = true;
    syncAutoplay();
  });
  experience.addEventListener("pointerleave", () => {
    hoverPaused = false;
    syncAutoplay();
  });
  experience.addEventListener("focusin", () => {
    focusPaused = true;
    syncAutoplay();
  });
  experience.addEventListener("focusout", (e) => {
    focusPaused = experience.contains(e.relatedTarget);
    syncAutoplay();
  });
  document.addEventListener("visibilitychange", syncAutoplay);
  motionPreference.addEventListener("change", syncAutoplay);

  document.addEventListener("keydown", (e) => {
    const openDialog = contentModal.classList.contains("is-open") ? contentModal
      : searchModal.classList.contains("is-open") ? searchModal : null;
    if (e.key === "Tab" && openDialog) {
      const controls = Array.from(openDialog.querySelectorAll("button:not(:disabled), input:not(:disabled)"));
      const first = controls[0];
      const last = controls[controls.length - 1];
      if (first && (!openDialog.contains(document.activeElement) ||
          (e.shiftKey ? document.activeElement === first : document.activeElement === last))) {
        e.preventDefault();
        (e.shiftKey ? last : first).focus();
      }
      return;
    }
    if (e.key === "Escape") {
      if (contentModal.classList.contains("is-open")) closeContentModal();
      else if (searchModal.classList.contains("is-open")) closeSearchModal();
      else if (header.classList.contains("menu-open")) {
        header.classList.remove("menu-open");
        menuToggle.setAttribute("aria-expanded", "false");
        syncAutoplay();
      }
    } else if (!contentModal.classList.contains("is-open") && !searchModal.classList.contains("is-open")) {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
        e.preventDefault();
        changeSlide(e.key === "ArrowRight" ? 1 : -1);
      }
    }
  });

  // Initialize without animation timers that could outlive a later transition.
  async function initialize() {
    setTransitioning(true);
    renderCards();
    renderSlide(activeIndex);
    new Set(slides.map((slide) => slide.image)).forEach((src) => {
      const image = new Image();
      image.src = src;
      void image.decode().catch(() => {});
    });
    if (!motionPreference.matches) {
      void copy.offsetWidth;
      copy.classList.add("is-visible");
      await waitForMotion(copy);
    }
    copy.classList.remove("is-entering", "is-visible");
    setTransitioning(false);
    syncAutoplay();
  }
  void initialize();
})();
</script>
</body>
</html>
