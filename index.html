<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101310">
<meta name="description" content="Bài giảng Nhóm 1 về vật chất theo triết học Mác - Lênin: quan điểm lịch sử, định nghĩa của Lênin, vận động, đứng im, không gian, thời gian và tính thống nhất vật chất của thế giới.">
<title>Vật Chất &amp; Vận Động — Triết Học Mác - Lênin (Nhóm 1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto:wght@300;400;500;700&subset=vietnamese&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --amber:#F5B731;
  --white:#ffffff;
  --muted:rgba(255,255,255,0.72);
  --ease:cubic-bezier(0.65,0,0.35,1);
  --card-width:170px;
  --card-height:265px;
  --card-gap:22px;
  --card-slot:192px;
  --body-font:"Roboto",Arial,sans-serif;
  --display-font:"Oswald","Bebas Neue",Impact,sans-serif;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  color:var(--white);
  background:#101310;
  font-family:var(--body-font);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,a{color:inherit;font:inherit;-webkit-tap-highlight-color:transparent}
button{border:0;background:transparent;cursor:pointer}
a{text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:4px}

.experience{
  position:relative;
  isolation:isolate;
  width:100vw;
  height:100vh;
  height:100dvh;
  min-height:520px;
  overflow:hidden;
  background:#111;
  cursor:pointer;
}
.cards-shell,.rail-controls,.site-header{cursor:default}

/* Background photo and dark gradient */
.backdrop,.backdrop-shade{position:absolute;inset:0}
.backdrop{z-index:-2;overflow:hidden;background:#181c19;pointer-events:none}
.backdrop img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 50%;
  transform:scale(1.015);
  transition:opacity .35s ease,transform 7s ease;
}
.backdrop img.is-switching{opacity:.12;transform:scale(1.055)}
.backdrop-shade{
  z-index:-1;
  pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,0.78) 0%,rgba(0,0,0,0.64) 34%,rgba(0,0,0,0.35) 60%,rgba(0,0,0,0.15) 100%),
             linear-gradient(0deg,rgba(0,0,0,0.65) 0%,transparent 45%);
}

/* Top progress bar */
.top-progress{
  position:absolute;
  z-index:50;
  inset:0 0 auto;
  height:3px;
  background:rgba(255,255,255,0.13);
  pointer-events:none;
}
.top-progress span,.line-progress{
  display:block;
  width:100%;
  height:100%;
  background:var(--amber);
  transform:scaleX(0);
  transform-origin:left center;
  will-change:transform;
}

/* Site header / Navigation */
.site-header{
  position:absolute;
  z-index:15;
  top:0;
  left:0;
  display:flex;
  width:100%;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  padding:32px 6.2vw 20px;
}
.brand{
  display:inline-flex;
  flex:0 0 auto;
  align-items:center;
  gap:12px;
  min-width:max-content;
  font-size:12px;
  font-weight:600;
  letter-spacing:.25em;
  line-height:1;
  text-transform:uppercase;
}
.brand-mark{width:24px;height:24px;color:var(--amber);flex:0 0 auto}
.brand-text{display:flex;flex-direction:column;gap:3px}
.brand-title{color:#fff;letter-spacing:.28em}
.brand-sub{color:var(--amber);font-size:9px;letter-spacing:.15em;font-weight:400}

.nav-links{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:clamp(14px,2vw,30px);
  margin-left:auto;
}
.nav-link{
  position:relative;
  padding:8px 0;
  color:rgba(255,255,255,0.78);
  font-size:11px;
  font-weight:500;
  letter-spacing:.1em;
  line-height:1;
  text-transform:uppercase;
  white-space:nowrap;
  transition:color .2s ease;
}
.nav-link::after{
  position:absolute;
  right:0;
  bottom:0;
  left:0;
  height:2px;
  background:var(--amber);
  content:"";
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .22s ease;
}
.nav-link:hover,.nav-link.is-active{color:#fff}
.nav-link.is-active::after{transform:scaleX(1)}

.nav-tools{display:flex;align-items:center;gap:14px}
.icon-button,.menu-toggle{
  display:grid;
  width:32px;
  height:32px;
  padding:0;
  place-items:center;
  border-radius:50%;
  color:#fff;
  transition:color .2s ease,background-color .2s ease,transform .2s ease;
}
.icon-button:hover{color:var(--amber);background:rgba(255,255,255,0.08);transform:translateY(-1px)}
.icon-button:disabled{cursor:default;opacity:.6}
.icon-button svg{width:18px;height:18px}
.menu-toggle{display:none;width:34px}
.menu-toggle span{display:block;width:21px;height:1.5px;background:#fff;transition:transform .2s ease}
.menu-toggle span+span{margin-top:-7px}
.menu-open .menu-toggle span:first-child{transform:translateY(3px) rotate(45deg)}
.menu-open .menu-toggle span:last-child{transform:translateY(-4px) rotate(-45deg)}

/* Left content block */
.hero-copy{
  position:absolute;
  z-index:3;
  bottom:12.5vh;
  left:8vw;
  width:min(520px,40vw);
}
.hero-copy.is-outgoing,.hero-copy.is-entering{pointer-events:none}
.copy-part{
  --stagger:0ms;
  opacity:1;
  transform:translateY(0);
  transition:opacity .34s ease var(--stagger),transform .34s ease var(--stagger);
}
.hero-copy.is-outgoing .copy-part,
.hero-copy.is-entering:not(.is-visible) .copy-part{
  opacity:0;
  transform:translateY(20px);
}
.hero-copy.is-outgoing .copy-part{transition-duration:.18s;transition-delay:0s}
[data-copy=region]{--stagger:0ms}
[data-copy=title]{--stagger:100ms}
[data-copy=description]{--stagger:200ms}
[data-copy=actions]{--stagger:300ms}

.region-line{
  display:flex;
  align-items:center;
  gap:13px;
  margin:0 0 26px;
  color:rgba(255,255,255,0.85);
  font-size:16px;
  font-weight:400;
  letter-spacing:.04em;
  line-height:1.2;
}
.region-dash{width:20px;height:2px;flex:0 0 auto;background:var(--amber)}

.hero-title{
  display:flex;
  flex-direction:column;
  gap:0.12em;
  margin:0;
  color:#fff;
  font-family:var(--display-font);
  font-size:clamp(46px,5.8vw,78px);
  font-weight:700;
  letter-spacing:.05em;
  line-height:1.24;
  text-transform:uppercase;
}
.hero-title span{display:block;white-space:nowrap}

.hero-description{
  max-width:420px;
  margin:18px 0 24px;
  color:var(--muted);
  font-size:13.5px;
  font-weight:300;
  line-height:1.65;
}

.hero-actions{display:flex;align-items:center;gap:14px}
.bookmark{
  display:grid;
  width:42px;
  height:42px;
  flex:0 0 auto;
  place-items:center;
  border:1px solid var(--amber);
  border-radius:50%;
  color:#15130e;
  background:var(--amber);
  transition:transform .2s ease,background-color .2s ease,color .2s ease;
}
.bookmark:hover{transform:scale(1.06)}
.bookmark svg{width:16px;height:18px}
.bookmark[aria-pressed="true"] svg path{fill:currentColor}

.discover{
  display:inline-flex;
  min-height:42px;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:0 22px;
  border:1px solid rgba(255,255,255,0.82);
  border-radius:999px;
  color:#fff;
  font-size:11px;
  font-weight:600;
  letter-spacing:.09em;
  line-height:1;
  text-transform:uppercase;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease;
}
.discover:hover{
  border-color:var(--amber);
  color:#19150c;
  background:var(--amber);
}
.discover svg{width:12px;height:12px;transition:transform .2s ease}
.discover:hover svg{transform:translateX(3px)}

/* Right card rail */
.destinations{position:absolute;z-index:5;inset:0;pointer-events:none}
.cards-shell{
  position:absolute;
  top:43.5%;
  left:44vw;
  width:calc(100vw - 44vw + 80px);
  overflow:visible;
  pointer-events:auto;
}
.cards-track{
  display:flex;
  width:max-content;
  gap:var(--card-gap);
  transform:translateX(0);
  will-change:transform;
}
.cards-track.is-shifting{
  transform:translateX(calc(-1 * var(--shift-slots, 1) * var(--card-slot)));
}
.cards-track.is-shifting,.cards-track.is-restoring{
  transition:transform .8s var(--ease);
}

.card-item{flex:0 0 var(--card-width)}
.destination-card{
  position:relative;
  display:flex;
  width:var(--card-width);
  height:var(--card-height);
  flex:0 0 var(--card-width);
  flex-direction:column;
  justify-content:flex-end;
  padding:0;
  text-align:left;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.15);
  border-radius:14px;
  background:#262a27;
  box-shadow:0 14px 36px rgba(0,0,0,0.28);
  isolation:isolate;
  cursor:pointer;
  transition:border-color .2s ease;
}
.destination-card:hover{border-color:rgba(245,183,49,0.5)}
.card-photo{
  position:absolute;
  z-index:-2;
  inset:0;
  background-position:center;
  background-size:cover;
  transition:transform .55s ease;
}
.destination-card::after{
  position:absolute;
  z-index:-1;
  inset:0;
  background:linear-gradient(180deg,transparent 25%,rgba(0,0,0,0.2) 45%,rgba(0,0,0,0.88) 100%);
  content:"";
}
.destination-card:hover .card-photo{transform:scale(1.06)}

.card-caption{padding:0 15px 17px}
.card-dash{display:block;width:16px;height:2px;margin-bottom:9px;background:var(--amber)}
.card-region{
  display:block;
  margin-bottom:7px;
  color:rgba(255,255,255,0.85);
  font-size:11px;
  font-weight:500;
  letter-spacing:.08em;
  line-height:1.3;
  text-transform:uppercase;
}
.card-title{
  display:flex;
  flex-direction:column;
  gap:3px;
  color:#fff;
  font-family:var(--display-font);
  font-size:21px;
  font-weight:600;
  letter-spacing:.02em;
  line-height:1.2;
  text-transform:uppercase;
}
.card-title span{display:block}

/* Below the cards: controls & counter */
.rail-controls{
  position:absolute;
  z-index:7;
  right:5vw;
  bottom:7.6vh;
  left:44vw;
  display:flex;
  align-items:center;
  gap:27px;
  pointer-events:auto;
}
.arrow-group{display:flex;flex:0 0 auto;gap:12px}
.arrow-button{
  display:grid;
  width:58px;
  height:58px;
  flex:0 0 auto;
  place-items:center;
  border:1px solid rgba(255,255,255,0.68);
  border-radius:50%;
  color:#fff;
  background:transparent;
  transition:border-color .2s ease,color .2s ease,transform .2s ease;
}
.arrow-button:hover{
  border-color:var(--amber);
  color:var(--amber);
  transform:scale(1.05);
}
.arrow-button:disabled{cursor:wait;opacity:.6}
.arrow-button svg{width:18px;height:18px}

.line-progress-track{
  height:1px;
  flex:1 1 auto;
  overflow:hidden;
  background:rgba(255,255,255,0.35);
}
.slide-counter{
  display:flex;
  min-width:64px;
  align-items:baseline;
  justify-content:flex-end;
  gap:5px;
  overflow:hidden;
  white-space:nowrap;
}
.counter-window{display:block;height:48px;overflow:hidden}
.counter-number{
  display:block;
  color:#fff;
  font-family:var(--display-font);
  font-size:48px;
  font-weight:700;
  line-height:1;
  transition:opacity .18s ease,transform .18s ease;
}
.counter-number.is-out{opacity:0;transform:translateY(-100%)}
.counter-number.is-in{opacity:0;transform:translateY(100%)}
.counter-total{color:rgba(255,255,255,0.65);font-size:11px;letter-spacing:.09em;font-weight:500}

/* Photo expansion animation */
.photo-expansion{
  position:absolute;
  z-index:1;
  top:var(--start-top);
  left:var(--start-left);
  width:var(--start-width);
  height:var(--start-height);
  overflow:hidden;
  border-radius:14px;
  background-color:#181c19;
  background-position:center;
  background-size:cover;
  transform:translateZ(0);
  transition:top .8s var(--ease),left .8s var(--ease),width .8s var(--ease),height .8s var(--ease),border-radius .8s var(--ease);
  pointer-events:none;
}
.photo-expansion::after{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,0.78) 0%,rgba(0,0,0,0.64) 34%,rgba(0,0,0,0.35) 60%,rgba(0,0,0,0.15) 100%),
             linear-gradient(0deg,rgba(0,0,0,0.65) 0%,transparent 45%);
  content:"";
}
.photo-expansion.is-expanded{
  top:0;
  left:0;
  width:100%;
  height:100%;
  border-radius:0;
}

/* Glassmorphic Slide Detail Modal */
.content-modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(8,10,9,0.78);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  opacity:0;
  pointer-events:none;
  transition:opacity .3s ease;
}
.content-modal.is-open{opacity:1;pointer-events:auto}
.modal-box{
  position:relative;
  width:min(660px,94vw);
  max-height:86vh;
  overflow-y:auto;
  padding:36px 36px 32px;
  background:rgba(22,26,23,0.95);
  border:1px solid rgba(255,255,255,0.16);
  border-radius:20px;
  box-shadow:0 24px 64px rgba(0,0,0,0.55);
  transform:scale(0.96) translateY(18px);
  transition:transform .3s cubic-bezier(0.16,1,0.3,1);
}
.content-modal.is-open .modal-box{transform:scale(1) translateY(0)}
.modal-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  margin-bottom:20px;
}
.modal-badge{
  display:inline-block;
  padding:4px 12px;
  border:1px solid var(--amber);
  border-radius:999px;
  color:var(--amber);
  font-size:10px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:12px;
}
.modal-title{
  margin:0;
  color:#fff;
  font-family:var(--display-font);
  font-size:28px;
  font-weight:700;
  line-height:1.3;
  text-transform:uppercase;
}
.modal-close{
  display:grid;
  width:36px;
  height:36px;
  flex:0 0 auto;
  place-items:center;
  border-radius:50%;
  color:rgba(255,255,255,0.7);
  background:rgba(255,255,255,0.08);
  transition:color .2s ease,background-color .2s ease;
}
.modal-close:hover{color:#fff;background:rgba(255,255,255,0.18)}
.modal-body{
  color:rgba(255,255,255,0.85);
  font-size:14px;
  font-weight:300;
  line-height:1.75;
}
.modal-body h3{margin:20px 0 10px;color:var(--amber);font-size:15px;font-weight:500}
.modal-table-wrap{overflow-x:auto;margin:0 0 18px}
.modal-table-wrap table{width:100%;min-width:480px;border-collapse:collapse;font-size:12px;line-height:1.6}
.modal-table-wrap th,.modal-table-wrap td{padding:10px 12px;border:1px solid rgba(255,255,255,.15);text-align:left;vertical-align:top}
.modal-table-wrap th{color:var(--amber);background:rgba(245,183,49,.08);font-weight:500}
.lesson-figure{margin:20px 0;padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(10,15,21,.6)}
.lesson-figure>svg{display:block;width:100%;height:auto}
.lesson-figure figcaption{margin-top:10px;color:var(--muted);font-size:11px;line-height:1.6}
.motion-examples{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;padding:12px 0}
.motion-examples>div{flex:1 1 82px;text-align:center;color:var(--amber)}
.motion-examples svg{display:block;width:48px;height:48px;margin:0 auto 10px}
.motion-examples strong{font-size:12px;font-weight:500;color:var(--white)}
.modal-body p{margin:0 0 14px}
.modal-body ul{margin:0 0 16px;padding-left:20px}
.modal-body li{margin-bottom:8px}
.modal-body blockquote{
  margin:18px 0;
  padding:14px 18px;
  border-left:3px solid var(--amber);
  background:rgba(245,183,49,0.08);
  border-radius:0 8px 8px 0;
  font-style:italic;
  color:#fff;
}
.modal-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-top:24px;
  padding-top:18px;
  border-top:1px solid rgba(255,255,255,0.1);
}
.modal-nav-button{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 16px;
  border:1px solid rgba(255,255,255,0.25);
  border-radius:999px;
  font-size:11px;
  font-weight:500;
  letter-spacing:.08em;
  text-transform:uppercase;
  transition:border-color .2s ease,color .2s ease;
}
.modal-nav-button:hover{border-color:var(--amber);color:var(--amber)}

/* Search overlay palette */
.search-modal{
  position:fixed;
  inset:0;
  z-index:110;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:12vh 20px 20px;
  background:rgba(8,10,9,0.78);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
}
.search-modal.is-open{opacity:1;pointer-events:auto}
.search-box{
  width:min(560px,94vw);
  background:rgba(22,26,23,0.96);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:18px;
  box-shadow:0 24px 60px rgba(0,0,0,0.6);
  overflow:hidden;
}
.search-input-wrap{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px 20px;
  border-bottom:1px solid rgba(255,255,255,0.1);
}
.search-input-wrap svg{width:18px;height:18px;color:var(--amber);flex:0 0 auto}
.search-input{
  width:100%;
  border:0;
  background:transparent;
  color:#fff;
  font-size:14px;
  outline:none;
}
.search-results{
  max-height:380px;
  overflow-y:auto;
  padding:10px 12px;
}
.search-item{
  display:flex;
  width:100%;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:12px 14px;
  border-radius:10px;
  text-align:left;
  transition:background-color .2s ease;
}
.search-item:hover{background:rgba(255,255,255,0.08)}
.search-item-info{display:flex;flex-direction:column;gap:3px}
.search-item-region{color:var(--amber);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.search-item-title{color:#fff;font-weight:500;font-size:13px}
.search-item-counter{color:rgba(255,255,255,0.5);font-size:11px;font-family:var(--display-font)}

/* Responsive adjustments */
@media(max-width:1120px) and (min-width:768px){
  .site-header{padding-inline:4vw;gap:20px}
  .brand-text{display:none}
  .nav-links{gap:14px}
  .nav-link{font-size:10px}
  .hero-copy{left:6vw;width:38vw}
  .hero-title{font-size:clamp(42px,5.5vw,68px)}
  .cards-shell,.rail-controls{left:46vw}
  .rail-controls{right:4vw;gap:18px}
  .arrow-button{width:52px;height:52px}
  .arrow-group{gap:9px}
}

@media(max-width:767px){
  :root{
    --card-width:122px;
    --card-height:clamp(150px,22vh,190px);
    --card-gap:14px;
    --card-slot:136px;
  }
  .backdrop img{object-position:56% center}
  .site-header{padding:22px 6vw 14px;gap:12px}
  .brand-text{display:none}
  .nav-links{
    position:absolute;
    top:66px;
    right:6vw;
    display:none;
    width:min(320px,88vw);
    align-items:stretch;
    justify-content:flex-start;
    gap:0;
    margin:0;
    padding:8px 16px;
    border:1px solid rgba(255,255,255,0.18);
    border-radius:12px;
    background:rgba(12,15,13,0.96);
    box-shadow:0 16px 40px rgba(0,0,0,0.4);
    backdrop-filter:blur(16px);
  }
  .menu-open .nav-links{display:flex;flex-direction:column}

    "modalContent": "<blockquote>Định nghĩa: &quot;Vật chất là một phạm trù triết học dùng để chỉ thực tại khách quan được đem lại cho con người trong cảm giác, được cảm giác của chúng ta chép lại, chụp lại, phản ánh và tồn tại không lệ thuộc vào cảm giác.&quot; - V.I Lenin</blockquote>\n<ul><li>Vật chất (Triết học): Là cái chung, vô hạn, vĩnh cửu (không bao giờ mất đi).</li><li>Vật thể/Dạng vật chất (KHTN): Là những cái riêng, cụ thể (như nguyên tử, điện tử, hạt, trường…), có giới hạn, có sinh ra và mất đi để hóa thành cái khác.</li></ul>\n<figure class=\"lesson-figure\"><svg viewBox=\"0 0 600 270\" role=\"img\" aria-label=\"Sơ đồ định nghĩa vật chất của Lênin\"><rect width=\"600\" height=\"270\" rx=\"12\" fill=\"#101827\"/><text x=\"300\" y=\"28\" fill=\"#f5b731\" font-size=\"13\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">MÔ HÌNH NHẬN THỨC LUẬN TRONG ĐỊNH NGHĨA LÊNIN</text><g transform=\"translate(30, 48)\"><rect width=\"230\" height=\"90\" rx=\"8\" fill=\"#162235\" stroke=\"#67b8ef\" stroke-width=\"1.5\"/><text x=\"115\" y=\"28\" fill=\"#67b8ef\" font-size=\"13\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">THỰC TẠI KHÁCH QUAN</text><text x=\"115\" y=\"52\" fill=\"#cbd5e1\" font-size=\"11\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">• Tồn tại độc lập với ý thức</text><text x=\"115\" y=\"70\" fill=\"#cbd5e1\" font-size=\"11\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">• Nguồn gốc của nhận thức</text></g><g transform=\"translate(260, 83)\"><path d=\"M10 10h60\" stroke=\"#f5b731\" stroke-width=\"2.5\"/><polygon points=\"70,5 80,10 70,15\" fill=\"#f5b731\"/><text x=\"45\" y=\"-2\" fill=\"#f5b731\" font-size=\"10\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">TÁC ĐỘNG</text><text x=\"45\" y=\"26\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">giác quan</text></g><g transform=\"translate(340, 48)\"><rect ze=\"10\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">⇒ Dạng biểu hiện cụ thể biến đổi</text></g></svg><figcaption>Mô hình phản ánh nhận thức luận và sự phân biệt giữa Vật chất (triết học) với Vật thể (KHTN).</figcaption></figure>",

    "modalContent": "<ul><li>Vật chất là cái có trước, gây nên cảm giác ở con người: Khi trực tiếp hoặc gián tiếp tác động lên giác quan con người, vật chất sẽ đem lại cho con người cảm giác, nhận thức. Vật chất là tính thứ nhất, là nguyên nhân, nguồn gốc khách quan của cảm giác.</li><li>Cảm giác, tư duy, ý thức chỉ là sự phản ánh của vật chất: Con người có thể &quot;chép lại, chụp lại, phản ánh&quot; hiện thực khách quan. Điều này khẳng định con người có khả năng nhận thức được thế giới vật chất khách quan.</li></ul>\n<figure class=\"lesson-figure\"><svg viewBox=\"0 0 600 230\" role=\"img\" aria-label=\"Mối quan hệ giữa vật chất và ý thức\"><rect width=\"600\" height=\"230\" rx=\"12\" fill=\"#101827\"/><text x=\"300\" y=\"26\" fill=\"#f5b731\" font-size=\"13\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">MỐI QUAN HỆ BIỆN CHỨNG GIỮA VẬT CHẤT VÀ Ý THỨC</text><g transform=\"translate(40, 50)\"><rect width=\"210\" height=\"145\" rx=\"10\" fill=\"#14233a\" stroke=\"#38bdf8\" stroke-width=\"2\"/><rect x=\"15\" y=\"15\" width=\"180\" height=\"26\" rx=\"5\" fill=\"#0284c7\"/><text x=\"105\" y=\"32\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">VẬT CHẤT (Tính thứ nhất)</text><text x=\"105\" y=\"66\" fill=\"#e0f2fe\" font-size=\"11\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">• Là cái có trước, cái gốc</text><text x=\"105\" y=\"86\" fill=\"#e0f2fe\" font-size=\"11\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">• Tồn tại khách quan</text><text x=\"105\" y=\"106\" fill=\"#e0f2fe\" font-size=\"11\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">• Quyết định nội dung ý thức</text><text x=\"105\" y=\"128\" fill=\"#38bdf8\" font-size=\"11\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">THỰC TẠI GỐC</text></g><g transform=\"translate(260, 80)\"><path d=\"M0 20h70\" stroke=\"#f5b731\" stroke-width=\"2.5\"/><polygon points=\"70     "badge": "Trang 18/28 • Slide 18",

    "modalContent": "<h3>Giải quyết triệt để hai mặt vấn đề cơ bản của triết học:</h3>\n<ul><li>Mặt thứ nhất (Bản thể luận): Khẳng định vật chất có trước, ý thức có sau, vật chất quyết định ý thức =&gt; phủ định hoàn toàn chủ nghĩa duy tâm.</li><li>Mặt thứ hai (Nhận thức luận): Khẳng định ý thức có thể phản ánh đúng hiện thực khách quan. =&gt; Phủ nhận Thuyết bất khả tri và chủ nghĩa hoài nghi.</li></ul>\n<h3>Khắc phục triệt để các hạn chế của chủ nghĩa duy vật trước Marx:</h3>\n<ul><li>CNDV cổ đại đồng nhất vật chất với vật thể cụ thể (nước, lửa, nguyên tử...).</li><li>CNDV cận đại đồng nhất vật chất với khối lượng và mang tính siêu hình, máy móc.<ul><li>Định nghĩa của Lênin đã chỉ ra: Vật chất là thực tại khách quan, không phụ thuộc vào trạng thái cấu tạo hay khối lượng cụ thể nào.</li></ul></li></ul>\n<figure class=\"lesson-figure\"><svg viewBox=\"0 0 600 240\" role=\"img\" aria-label=\"Giải quyết hai mặt vấn đề cơ bản của triết học\"><rect width=\"600\" height=\"240\" rx=\"12\" fill=\"#101827\"/><rect x=\"160\" y=\"15\" width=\"280\" height=\"34\" rx=\"8\" fill=\"#1e293b\" stroke=\"#f5b731\" stroke-width=\"1.5\"/><text x=\"300\" y=\"36\" fill=\"#f5b731\" font-size=\"13\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">VẤN ĐỀ CƠ BẢN CỦA TRIẾT HỌC</text><path d=\"M240 49v26h-110v20M360 49v26h110v20\" fill=\"none\" stroke=\"#54677e\" stroke-width=\"1.5\"/><g transform=\"translate(30, 95)\"><rect width=\"250\" height=\"120\" rx=\"8\" fill=\"#142534\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/><text x=\"125\" y=\"24\" fill=\"#38bdf8\" font-size=\"12\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">MẶT 1: BẢN THỂ LUẬN</text><text x=\"125\" y=\"42\" fill=\"#94a3b8\" font-size=\"10\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">(Vật chất hay ý thức có trước?)</text><text x=\"125\" y=\"66\" fill=\"#e2e8f0\" font-size=\"11\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">Khẳng định: VẬT CHẤT CÓ TRƯỚC</text><rect x=\"25\" y=\"80\" width=\"200\" height=\"26\" rx=\"5\" fill=\"#ef4444\" fill-opacity=\"0.2\" stroke=\"#ef4444\"/><text x=\"125\" y=\"97\" fill=\"#fca5a5\" font-size=\"11\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">BÁC BỎ CHỦ NGHĨA DUY TÂM</text></g><g transform=\"translate(320, 95)\"><rect width=\"250\" height=\"120\" rx=\"8\" fill=\"#201a35\" stroke=\"#a78bfa\" stroke-width=\"1.5\"/><text x=\"125\" y=\"24\" fill=\"#a78bfa\" font-size=\"12\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">MẶT 2: NHẬN THỨC LUẬN</text><text x=\"125\" y=\"42\" fill=\"#94a3b8\" font-size=\"10\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">(Con người có nhận thức được không?)</text><text x=\"125\" y=\"66\" fill=\"#e2e8f0\" font-size=\"11\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">Khẳng định: CON NGƯỜI NHẬN THỨC ĐƯỢC</text><rect x=\"20\" y=\"80\" width=\"210\" height=\"26\" rx=\"5\" fill=\"#f59e0b\" fill-opacity=\"0.2\" stroke=\"#f59e0b\"/><text x=\"125\" y=\"97\" fill=\"#fde68a\" font-size=\"11\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">BÁC BỎ THUYẾT BẤT KHẢ TRI</text></g></svg><figcaption>Định nghĩa của Lênin giải quyết triệt để hai mặt của vấn đề cơ bản trong triết học.</figcaption></figure>",

    "modalContent": "<h3>Đặt nền tảng lý luận để xây dựng Chủ nghĩa duy vật lịch sử:</h3>\n<ul><li>Giúp nhận diện được: Cái gì là vật chất trong đời sống xã hội? Đó chính là tồn tại xã hội, phương thức sản xuất, điều kiện kinh tế, quy luật khách quan.</li><li>Bác bỏ quan điểm duy tâm về lịch sử, Khẳng định nguyên nhân sâu xa của mọi biến đổi lịch sử bắt nguồn từ sự phát triển của sản xuất vật chất.</li></ul>\n<h3>Ý nghĩa phương pháp luận trong hoạt động thực tiễn:</h3>\n<ul><li>Đòi hỏi con người trong mọi hoạt động (học tập, làm việc, hoạch định chính sách) phải xuất phát từ hiện thực, tôn trọng quy luật khách quan, không được lấy ý muốn chủ quan áp đặt cho thực tế.</li></ul>\n<figure class=\"lesson-figure\"><svg viewBox=\"0 0 600 240\" role=\"img\" aria-label=\"Mô hình Duy vật lịch sử trong khoa học xã hội\"><rect width=\"600\" height=\"240\" rx=\"12\" fill=\"#101827\"/><text x=\"300\" y=\"26\" fill=\"#f5b731\" font-size=\"13\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">NỀN TẢNG DUY VẬT LỊCH SỬ TRONG ĐỜI SỐNG XÃ HỘI</text><g transform=\"translate(60, 45)\"><rect width=\"480\" height=\"65\" rx=\"8\" fill=\"#241b35\" stroke=\"#c084fc\" stroke-width=\"1.5\"/><text x=\"240\" y=\"26\" fill=\"#c084fc\" font-size=\"12\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">Ý THỨC XÃ HỘI &amp; THƯỢNG TẦNG KIẾN TRÚC</text><text x=\"240\" y=\"48\" fill=\"#cbd5e1\" font-size=\"11\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">Tư tưởng, pháp quyền, chính trị, đạo đức, tôn giáo, triết học...</text></g><g transform=\"translate(300, 110)\"><path d=\"M0 0v22\" stroke=\"#f5b731\" stroke-width=\"2.5\"/><polygon points=\"-6,18 0,26 6,18\" fill=\"#f5b731\"/><text x=\"18\" y=\"15\" fill=\"#f5b731\" font-size=\"10\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">QUYẾT ĐỊNH</text></g><g transform=\"translate(60, 138)\"><rect width=\"480\" height=\"80\" rx=\"8\" fill=\"#13271f\" stroke=\"#34d399\" stroke-width=\"1.5\"/><text x=\"240\" y=\"26\" fill=\"#34d399\" font-size=\"13\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">TỒN TẠI XÃ HỘI &amp; SẢN XUẤT VẬT CHẤT (NỀN TẢNG GỐC)</text><text x=\"240\" y=\"48\" fill=\"#e2e8f0\" font-size=\"11\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">Phương thức sản xuất • Điều kiện địa lý • Dân cư • Quy luật khách quan</text><text x=\"240\" y=\"68\" fill=\"#86efac\" font-size=\"10\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">⇒ Hoạt động thực tiễn phải xuất phát từ hiện thực, không chủ quan duy ý chí</text></g></svg><figcaption>Mô hình Duy vật lịch sử: Tồn tại xã hội quyết định ý thức xã hội.</figcaption></figure>",

    "description": "Theo Ăngghen, vận động bao gồm mọi sự biến đổi, là phương thức tồn tại cố hữu, tuyệt đối và vĩnh viễn của vật chất.",

    "modalContent": "<p>Định nghĩa (theo Ăngghen):<br>Vận động là phương thức tồn tại của vật chất, bao gồm mọi sự biến đổi nói chung — từ dịch chuyển vị trí đơn giản đến tư duy.</p>\n<ul><li>Vận động là thuộc tính cố hữu, gắn liền với vật chất — không tách rời vật chất</li><li>Vận động là tuyệt đối, vĩnh viễn — không có vật chất nào tồn tại mà không vận động (kể cả cái tưởng như &quot;đứng yên&quot;)</li><li>Vận động không do ai sinh ra, cũng không mất đi — chỉ chuyển hoá từ dạng này sang dạng khác</li></ul>\n<p>Ví dụ: Trái Đất quay quanh Mặt Trời, đến các thiên hà dịch chuyển trong vũ trụ — tất cả đều là vận động ở các cấp độ khác nhau</p>\n<figure class=\"lesson-figure\"><svg viewBox=\"0 0 600 335\" role=\"img\" aria-label=\"Sơ đồ vận động của 8 hành tinh quanh Mặt Trời\"><defs><radialGradient id=\"sunGlow\" cx=\"50%\" cy=\"50%\" r=\"50%\"><stop offset=\"0%\" stop-color=\"#fff\" stop-opacity=\"0.9\"/><stop offset=\"35%\" stop-color=\"#f59e0b\" stop-opacity=\"0.8\"/><stop offset=\"70%\" stop-color=\"#d97706\" stop-opacity=\"0.25\"/><stop offset=\"100%\" stop-color=\"#b45309\" stop-opacity=\"0\"/></radialGradient><radialGradient id=\"sunDisc\" cx=\"40%\" cy=\"40%\" r=\"60%\"><stop offset=\"0%\" stop-color=\"#fef08a\"/><stop offset=\"60%\" stop-color=\"#f59e0b\"/><stop offset=\"100%\" stop-color=\"#d97706\"/></radialGradient></defs><rect width=\"600\" height=\"335\" rx=\"12\" fill=\"#0d141f\"/><g transform=\"translate(170, 10)\"><rect width=\"260\" height=\"24\" rx=\"12\" fill=\"#131e2c\" stroke=\"#f5b731\" stroke-width=\"1.2\"/><circle cx=\"18\" cy=\"12\" r=\"5\" fill=\"#f5b731\"/><path d=\"M15 12a3 3 0 1 1 4 -2.5\" fill=\"none\" stroke=\"#131e2c\" stroke-width=\"1.2\"/><polygon points=\"19,8 20,11 17,10.5\" fill=\"#131e2c\"/><text x=\"138\" y=\"16\" fill=\"#fcd34d\" font-size=\"10.5\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">QUỸ ĐẠO VẬN ĐỘNG HỆ MẶT TRỜI</text></g><text x=\"18\" y=\"41\" fill=\"#67b8ef\" font-size=\"8.5\" font-we     "description": "Đứng im là trạng thái vận động trong thế cân bằng, ổn định, chỉ tương đối và tạm thời trong một quan hệ nhất định.",
    "badge": "Trang 24/28 • Slide 24",
    "modalHeading": "ĐỨNG IM",
    "modalContent": "<p>Đứng im là trạng thái vận động đặc biệt — vận động trong thế cân bằng, ổn định, chưa làm thay đổi căn bản về chất của sự vật.</p>\n<ul><li>Đứng im chỉ là tương đối, tạm thời — không phải phủ định vận động, mà là một dạng vận động đặc biệt</li><li>Đứng im chỉ xảy ra trong một mối quan hệ, một hình thức vận động nhất định, không phải với mọi quan hệ</li><li>Vận động là tuyệt đối, đứng im là tương đối — đứng im chỉ là biểu hiện của trạng thái vận động trong sự ổn định tạm thời</li></ul>\n<p>Ví dụ: Một cuốn sách đặt yên trên bàn — đứng im so với mặt bàn, nhưng vẫn đang vận động cùng Trái Đất quay quanh trục và quanh Mặt Trời</p>\n<figure class=\"lesson-figure\"><svg viewBox=\"0 0 600 240\" role=\"img\" aria-label=\"Sơ đồ đứng im là tương đối, vận động là tuyệt đối\"><rect width=\"600\" height=\"240\" rx=\"12\" fill=\"#101827\"/><text x=\"300\" y=\"26\" fill=\"#f5b731\" font-size=\"13\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">TÍNH TƯƠNG ĐỐI CỦA ĐỨNG IM &amp; TÍNH TUYỆT ĐỐI CỦA VẬN ĐỘNG</text><g transform=\"translate(30, 48)\"><rect width=\"255\" height=\"140\" rx=\"10\" fill=\"#152132\" stroke=\"#67b8ef\" stroke-width=\"1.5\"/><text x=\"127\" y=\"26\" fill=\"#67b8ef\" font-size=\"12\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">HỆ QUY CHIẾU 1: MẶT BÀN</text><g transform=\"translate(127, 70)\"><rect x=\"-40\" y=\"10\" width=\"80\" height=\"8\" rx=\"2\" fill=\"#64748b\"/><rect x=\"-25\" y=\"-12\" width=\"50\" height=\"22\" rx=\"3\" fill=\"#f5b731\"/><text x=\"0\" y=\"3\" fill=\"#101827\" font-size=\"9\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">SÁCH</text></g><rect x=\"50\" y=\"98\" width=\"155\" height=\"24\" rx=\"4\" fill=\"#0284c7\" fill-opacity=\"0.2\"/><text x=\"127\" y=\"114\" fill=\"#38bdf8\" font-size=\"11\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">v = 0 (ĐỨNG IM)</text><text x=\"127\" y=\"132\" fill=\"#94a3b8\" font-size=\"10\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">Chỉ tạm thời trong 1 quan hệ</text></g><g transform=\"translate(315, 48)\"><rect width=\"255\" height=\"140\" rx=\"10\" fill=\"#201c36\" stroke=\"#a78bfa\" stroke-width=\"1.5\"/><text x=\"127\" y=\"26\" fill=\"#a78bfa\" font-size=\"12\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">HỆ QUY CHIẾU 2: VŨ TRỤ</text><g transform=\"translate(127, 68)\"><circle cx=\"0\" cy=\"0\" r=\"18\" fill=\"#1e3a8a\" stroke=\"#60a5fa\" stroke-width=\"1.5\"/><ellipse cx=\"0\" cy=\"0\" rx=\"24\" ry=\"7\" fill=\"none\" stroke=\"#60a5fa\" stroke-dasharray=\"2 2\"/><text x=\"0\" y=\"4\" fill=\"#fff\" font-size=\"8\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">Trái Đất</text><path d=\"M22 0a22 22 0 0 1 -44 0\" fill=\"none\" stroke=\"#f5b731\" stroke-width=\"1.5\"/><polygon points=\"-22,-2 -26,2 -20,4\" fill=\"#f5b731\"/></g><rect x=\"35\" y=\"98\" width=\"185\" height=\"24\" rx=\"4\" fill=\"#7c3aed\" fill-opacity=\"0.2\"/><text x=\"127\" y=\"114\" fill=\"#c084fc\" font-size=\"11\" font-weight=\"bold\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">v = 107.000 km/h (VẬN ĐỘNG)</text><text x=\"127\" y=\"132\" fill=\"#94a3b8\" font-size=\"10\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">Vận động tuyệt đối, vĩnh viễn</text></g><text x=\"300\" y=\"215\" fill=\"#f5b731\" font-size=\"11\" font-family=\"Arial,sans-serif\" text-anchor=\"middle\">⇒ Đứng im là trạng thái vận động trong thăng bằng, chỉ là tương đối và tạm thời</text></svg><figcaption>Sơ đồ hệ quy chiếu: Đứng im là tương đối, vận động là tuyệt đối.</figcaption></figure>",

    "description": "Không gian thể hiện quảng tính và kết cấu; thời gian thể hiện độ dài diễn biến, trình tự trước–sau của các quá trình.",
    "badge": "Trang 25/28 • Slide 25",
    "modalHeading": "KHÔNG GIAN, THỜI GIAN LÀ GÌ?",
    "modalContent": "<p>Không gian:<br>Hình thức tồn tại của vật chất, thể hiện quảng tính (chiều dài, rộng, cao), kết cấu, và sự cùng tồn tại, tách biệt giữa các sự vật.</p>\n<p>Thời gian:<br>Hình thức tồn tại của vật chất, thể hiện độ dài diễn biến, trình tự trước–sau của các quá trình.</p>\n<p>Không gian và thời gian không tồn tại độc lập, mà gắn liền với vật chất đang vận động — không có vật chất &quot;phi không gian, phi thời gian&quot;.</p>\n<figure class=\"lesson-figure\"><svg viewBox=\"0 0 600 340\" role=\"img\" aria-label=\"Minh họa nón ánh sáng Minkowski với trục thời gian, hai trục không gian, sự kiện hiện tại và đường thế giới\"><rect width=\"600\" height=\"340\" rx=\"12\" fill=\"#101827\"/><path d=\"M300 170 210 62a90 25 0 0 1 180 0Z\" fill=\"#67b8ef\" fill-opacity=\".2\" stroke=\"#67b8ef\" stroke-width=\"1.5\"/><ellipse cx=\"300\" cy=\"62\" rx=\"90\" ry=\"25\" fill=\"none\" stroke=\"#67b8ef\" stroke-width=\"1.5\"/><path d=\"M300 170 210 278a90 25 0 0 0 180 0Z\" fill=\"#9fa3e7\" fill-opacity=\".16\" stroke=\"#9fa3e7\" stroke-width=\"1.5\"/><ellipse cx=\"300\" cy=\"278\" rx=\"90\" ry=\"25\" fill=\"none\" stroke=\"#9fa3e7\" stroke-width=\"1.5\"/><line x1=\"300\" y1=\"318\" x2=\"300\" y2=\"22\" stroke=\"#e5eaf2\" stroke-width=\"1.5\"/><polygon points=\"300,18 296,26 304,26\" fill=\"#e5eaf2\"/><text x=\"314\" y=\"25\" fill=\"#e5eaf2\" font-size=\"12\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">t — Thời gian</text><line x1=\"110\" y1=\"170\" x2=\"480\" y2=\"170\" stroke=\"#e5eaf2\" stroke-width=\"1.5\"/><polygon points=\"485,170 477,166 477,174\" fill=\"#e5eaf2\"/><text x=\"440\" y=\"192\" fill=\"#e5eaf2\" font-size=\"11.5\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">x — Không gian</text><line x1=\"184\" y1=\"239\" x2=\"416\" y2=\"101\" stroke=\"#e5eaf2\" stroke-width=\"1.5\"/><polygon points=\"420,99 411,100 415,107\" fill=\"#e5eaf2\"/><text x=\"426\" y=\"96\" fill=\"#e5eaf2\" font-size=\"11.5\" font-weight=\"bold\" font-family=\"Arial   const duration = 9000;

  function makeCard(slide, index) {
    const item = document.createElement("article");
    item.className = "card-item";
    item.setAttribute("role", "listitem");
    item.dataset.slideIndex = String(index);

    const card = document.createElement("button");
    card.type = "button";
    card.className = "destination-card";
    card.disabled = transitioning;
    card.setAttribute("aria-label", slide.region + ": " + slide.title.join(" "));

    const photo = document.createElement("div");
    photo.className = "card-photo";
    photo.setAttribute("aria-hidden", "true");
    photo.style.backgroundImage = 'url("' + slide.image + '")';

    const caption = document.createElement("div");
    caption.className = "card-caption";
    const dash = document.createElement("span");
    dash.className = "card-dash";
    dash.setAttribute("aria-hidden", "true");

    const label = document.createElement("span");
    label.className = "card-region";
    label.textContent = slide.region;

    const title = document.createElement("strong");
    title.className = "card-title";
    slide.title.forEach((line) => {
      const span = document.createElement("span");
      span.textContent = line;
      title.appendChild(span);
    });

    caption.append(dash, label, title);
    card.append(photo, caption);
    item.appendChild(card);
    card.addEventListener("click", () => { void navigateToSlide(index, item); });
    return item;
  }

  function renderCards() {
    const cards = document.createDocumentFragment();
    for (let step = 1; step <= 5; step++) {

  function paintProgress(ratio) {

    bars.forEach((bar) => {
      bar.style.transition = "none";
      bar.style.transform = "scaleX(" + value + ")";
    });
  }

  function stopAutoplay() {
    if (timer === null) return;
    clearTimeout(timer);
    timer = null;
    timeLeft = Math.max(0, timeLeft - (performance.now() - timerStarted));

  }

  function syncAutoplay() {

      : userPaused ? "Tiếp tục tự động chuyển slide" : "Tạm dừng tự động chuyển slide");
    pauseIcon.style.display = explicitlyPaused ? "none" : "";
    playIcon.style.display = explicitlyPaused ? "" : "none";

    const blocked = explicitlyPaused || hoverPaused || focusPaused || document.hidden ||
      transitioning || header.classList.contains("menu-open") ||
      contentModal.classList.contains("is-open") || searchModal.classList.contains("is-open");
    if (blocked) {

    }
    if (timer !== null) return;

    paintProgress(1 - timeLeft / duration);
    timerStarted = performance.now();

      bar.style.transition = "transform " + timeLeft + "ms linear";

  function waitForMotion(element, property) {

    return Promise.all(animations.map((animation) => animation.finished.catch(() => {})));
  }

  async function updateCounter(index) {
    counter.classList.add("is-out");
    await waitForMotion(counter);
    counter.textContent = String(index + 1).padStart(2, "0");
    counter.classList.remove("is-out");
    counter.classList.add("is-in");

    counter.classList.remove("is-in");
    await waitForMotion(counter);
  }

    copy.classList.remove("is-outgoing");
    copy.classList.add("is-entering");

  function prepareExpansion(card, reverse = false) {
    const rect = card.getBoundingClientRect();
    const bounds = experience.getBoundingClientRect();
    const expansion = document.createElement("div");
    expansion.className = "photo-expansion";
    expansion.setAttribute("aria-hidden", "true");

    expansion.style.setProperty("--start-top", (rect.top - bounds.top) + "px");

    expansion.style.setProperty("--start-width", rect.width + "px");
    expansion.style.setProperty("--start-height", rect.height + "px");
    if (reverse) expansion.classList.add("is-expanded");
    experience.appendChild(expansion);

    void expansion.offsetWidth;
    expansion.classList.toggle("is-expanded", !reverse);

  }

  async function animateBackground(index, promoted, previousIndex) {
    if (promoted) {
      const stepIndex = Array.from(track.children).indexOf(promoted) + 1;
      const expansion = prepareExpansion(promoted);
      try {
        if (stepIndex > 0) {
          for (let s = 1; s <= stepIndex; s++) {
            const incomingIndex = (previousIndex + 5 + s) % slides.length;
            track.appendChild(makeCard(slides[incomingIndex], incomingIndex));
          }
          for (let i = 0; i < stepIndex - 1; i++) {
            const preceding = track.children[i];
            if (preceding) {
              preceding.style.transition = "opacity .3s ease";
              preceding.style.opacity = "0";
            }
          }
          track.style.setProperty("--shift-slots", String(stepIndex));
          void track.offsetWidth;
          track.classList.add("is-shifting");

        await Promise.all([waitForMotion(expansion), waitForMotion(track, "transform")]);
        activePhoto.src = slides[index].image;
      } finally {

    } else if (index === (previousIndex - 1 + slides.length) % slides.length) {
      // Reverse the forward transition: return the current background to the rail.
      const returning = makeCard(slides[previousIndex], previousIndex);

        expansion.remove();
      }

      await waitForMotion(activePhoto, "opacity");

      activePhoto.classList.remove("is-switching");
      await waitForMotion(activePhoto, "opacity");

  function normalizeSearch(text) {

    openSearchModal();
    if (saved.size === 0) {
      searchResults.innerHTML = '<div style="padding:20px;text-align:center;color:rgba(255,255,255,0.6);font-size:13px;">Bạn chưa đánh dấu slide nào. Hãy nhấn nút bookmark tròn màu hổ phách để lưu slide yêu thích!</div>';
    } else {
      searchResults.innerHTML = "";
      saved.forEach((idx) => {
        const slide = slides[idx];
        const item = document.createElement("button");
        item.type = "button";
        item.className = "search-item";
        item.innerHTML = `
          <div class="search-item-info">
            <span class="search-item-region">${slide.region}</span>
            <span class="search-item-title">${slide.title.join(" ")}</span>
          </div>
          <span class="search-item-counter">${String(idx + 1).padStart(2, "0")} / ${slides.length}</span>
        `;
        item.addEventListener("click", () => {
          closeSearchModal();
          jumpToSlide(idx);
        });
        searchResults.appendChild(item);
      });
    }
  });

  searchInput.addEventListener("input", () => renderSearchResults(searchInput.value));
  searchModal.addEventListener("click", (e) => {
    if (e.target === searchModal) closeSearchModal();
  });

  menuToggle.addEventListener("click", () => {
    const open = menuToggle.getAttribute("aria-expanded") !== "true";
    menuToggle.setAttribute("aria-expanded", String(open));
    menuToggle.setAttribute("aria-label", open ? "Đóng điều hướng" : "Mở điều hướng");
    header.classList.toggle("menu-open", open);
    syncAutoplay();
  });

  // Close mobile menu when clicking outside
  document.addEventListener("pointerdown", (e) => {
    if (header.classList.contains("menu-open") && !header.contains(e.target)) {
      header.classList.remove("menu-open");
      menuToggle.setAttribute("aria-expanded", "false");
      menuToggle.setAttribute("aria-label", "Mở điều hướng");
      syncAutoplay();
    }
  });

  navLinks.forEach((link) => {
    link.addEventListener("click", () => {
      const jumpIndex = parseInt(link.dataset.jump, 10);
      jumpToSlide(jumpIndex);
      header.classList.remove("menu-open");
      menuToggle.setAttribute("aria-expanded", "false");
      menuToggle.setAttribute("aria-label", "Mở điều hướng");
      syncAutoplay();
    });
  });

  // Mobile touch swipe gesture navigation
  let touchStartX = 0;
  let touchStartY = 0;
  let touchStartTime = 0;
  let lastSwipeTime = 0;

  experience.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartTime = performance.now();
  }, { passive: true });

  experience.addEventListener("touchend", (e) => {
    if (e.changedTouches.length !== 1) return;
    if (contentModal.classList.contains("is-open") ||
        searchModal.classList.contains("is-open") ||
        header.classList.contains("menu-open")) return;

    const deltaX = e.changedTouches[0].clientX - touchStartX;
    const deltaY = e.changedTouches[0].clientY - touchStartY;
    const duration = performance.now() - touchStartTime;

    if (Math.abs(deltaX) >= 45 && Math.abs(deltaX) > Math.abs(deltaY) * 1.3 && duration < 800) {
      lastSwipeTime = performance.now();
      if (deltaX < 0) {
        changeSlide(1);
      } else {
        changeSlide(-1);
      }
    }
  }, { passive: true });

  // Direct click on hero background or title area opens slide detail modal
  experience.addEventListener("click", (e) => {
    if (performance.now() - lastSwipeTime < 400) return;
    if (transitioning) return;
    if (contentModal.classList.contains("is-open") ||
        searchModal.classList.contains("is-open") ||
        bookmarksModal.classList.contains("is-open") ||
        header.classList.contains("menu-open")) return;

    if (window.getSelection && window.getSelection().toString().trim().length > 0) return;

    if (e.target.closest("button, a, input, select, textarea, .cards-shell, .rail-controls, .site-header")) {
      return;
    }

    openContentModal(activeIndex);
  });

  autoplayToggle.addEventListener("click", () => {
    userPaused = !userPaused;
    syncAutoplay();
  });
  experience.addEventListener("pointerenter", () => {
    hoverPaused = true;
    syncAutoplay();
  });
  experience.addEventListener("pointerleave", () => {
    hoverPaused = false;
    syncAutoplay();
  });
  experience.addEventListener("focusin", () => {
    focusPaused = true;
    syncAutoplay();
  });
  experience.addEventListener("focusout", (e) => {
    focusPaused = experience.contains(e.relatedTarget);
    syncAutoplay();
  });
  document.addEventListener("visibilitychange", syncAutoplay);
  motionPreference.addEventListener("change", syncAutoplay);

  document.addEventListener("keydown", (e) => {
    const openDialog = contentModal.classList.contains("is-open") ? contentModal
      : searchModal.classList.contains("is-open") ? searchModal : null;
    if (e.key === "Tab" && openDialog) {
      const controls = Array.from(openDialog.querySelectorAll("button:not(:disabled), input:not(:disabled)"));
      const first = controls[0];
      const last = controls[controls.length - 1];
      if (first && (!openDialog.contains(document.activeElement) ||
          (e.shiftKey ? document.activeElement === first : document.activeElement === last))) {
        e.preventDefault();
        (e.shiftKey ? last : first).focus();
      }
      return;
    }
    if (e.key === "Escape") {
      if (contentModal.classList.contains("is-open")) closeContentModal();
      else if (searchModal.classList.contains("is-open")) closeSearchModal();
      else if (header.classList.contains("menu-open")) {
        header.classList.remove("menu-open");
        menuToggle.setAttribute("aria-expanded", "false");
        syncAutoplay();
      }
    } else if (!contentModal.classList.contains("is-open") && !searchModal.classList.contains("is-open")) {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
        e.preventDefault();
        changeSlide(e.key === "ArrowRight" ? 1 : -1);
      }
    }
  });

  // Initialize without animation timers that could outlive a later transition.
  async function initialize() {
    setTransitioning(true);
    renderCards();
    renderSlide(activeIndex);
    new Set(slides.map((slide) => slide.image)).forEach((src) => {
      const image = new Image();
      image.src = src;
      void image.decode().catch(() => {});
    });
    if (!motionPreference.matches) {
      void copy.offsetWidth;
      copy.classList.add("is-visible");
      await waitForMotion(copy);
    }
    copy.classList.remove("is-entering", "is-visible");
    setTransitioning(false);
    syncAutoplay();
  }
  void initialize();
})();
</script>
</body>
</html>
